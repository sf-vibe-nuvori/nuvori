<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Nuvori" />
  <meta name="theme-color" content="#F8F6F2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0E0C26" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <link rel="manifest" href="manifest.json" />
  <!-- 글꼴: Pretendard (한글, Figma Inter 대응) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <title>Nuvori — 스마트 장보기</title>
  <style>
    /* ================================================================
       🎨 Nuvori 디자인 토큰 — 전체 테마는 이 블록만 수정하면 바뀝니다
       (Figma MCP 연동 시 Figma 스타일 변수를 아래 값에 1:1 매핑)
       ================================================================ */
    :root {
      /* ── 브랜드 & 배경 ── */
      --brand: #FBF7F0;             /* 앱 외곽 배경 (v2 크림 화이트) */
      --brand-gradient: none;       /* v2: 그라데이션 제거 */
      --on-brand: #3B2F25;          /* 브랜드 배경 위 텍스트 */
      --on-brand-soft: rgba(59, 47, 37, 0.72);
      --glass: rgba(169, 128, 79, 0.10);       /* 브랜드 배경 위 반투명 면 */
      --glass-border: rgba(169, 128, 79, 0.22);
      --background: #FBF7F0;        /* 페이지/입력창 기본 배경 */
      --card: #FFFDF9;              /* 카드 배경 */
      --foreground: #3B2F25;        /* 기본 텍스트 */
      --foreground-soft: #5C4A3A;   /* 중간 톤 텍스트 (AI 노트 등) */
      --muted-foreground: #8C7B6B;  /* 보조 텍스트 */
      --secondary: #F3EADC;         /* 기본 버튼/세그먼트 배경 */
      --secondary-soft: #E9DCC6;    /* 연한 배경 (업로드박스/썸네일) */
      --border: #E6DACA;            /* 일반 테두리 */
      --border-strong: #D6C4AC;     /* 강조 테두리 (업로드 점선 등) */

      /* ── 포인트 컬러 ── */
      --primary: #A9804F;           /* 주 액션: 버튼/활성 칩/합계 금액 (v2 따뜻한 진한 베이지) */
      --primary-strong: #8A6640;    /* 주 액션 테두리/어두운 강조 */
      --on-primary: #ffffff;        /* 주 액션 위 텍스트 */
      --success: #10b981;           /* 주문 버튼 */
      --success-strong: #059669;   /* 주문 버튼 테두리 */
      --success-text: #4F7A4A;      /* 성공 계열 텍스트 (토스트/절약 배지) */
      --danger: #e11d48;            /* 삭제/위험 텍스트 */

      /* ── 포인트 컬러 투명 변형 ── */
      --tint-primary-weak: rgba(169, 128, 79, 0.04);    /* 업로드 호버 */
      --tint-primary-soft: rgba(169, 128, 79, 0.06);    /* 칩 배경 */
      --tint-primary-medium: rgba(169, 128, 79, 0.06);  /* AI 노트 배경 */
      --tint-primary-strong: rgba(169, 128, 79, 0.12);  /* 칩 호버 */
      --tint-primary-border: rgba(169, 128, 79, 0.18);  /* 칩 테두리 */
      --tint-primary-overlay: rgba(169, 128, 79, 0.04); /* 검수 박스 배경 */
      --tint-success-bg: rgba(16, 185, 129, 0.15);     /* 토스트 배경 */
      --tint-success-border: rgba(16, 185, 129, 0.5);  /* 토스트 테두리 */
      --tint-success-soft: rgba(16, 185, 129, 0.1);    /* 절약 노트 배경 */
      --tint-success-note-border: rgba(16, 185, 129, 0.25);
      --tint-danger-bg: rgba(244, 63, 94, 0.16);       /* 삭제 버튼 배경 */
      --tint-danger-border: rgba(244, 63, 94, 0.4);    /* 삭제 버튼 테두리 */

      /* ── 3종 배지 (규칙: 이 3종 외 배지 금지) ── */
      --pill-short-bg: rgba(245, 158, 11, 0.16);   /* ⚠️ 부족하다 */
      --pill-short-fg: #b45309;
      --pill-short-border: rgba(245, 158, 11, 0.35);
      --pill-skip-bg: rgba(16, 185, 129, 0.16);    /* ✅ 안 사도 된다 */
      --pill-skip-fg: #047857;
      --pill-skip-border: rgba(16, 185, 129, 0.35);
      --pill-buy-bg: rgba(244, 63, 94, 0.16);      /* 🛒 사야 한다 */
      --pill-buy-fg: #e11d48;
      --pill-buy-border: rgba(244, 63, 94, 0.35);

      /* ── v2 상태 알약 (레시피 매칭 · 소진 예상 — 아이템 카드 3종 배지와 별개) ── */
      --pill-ok-bg: #E6F0E1;     /* 바로 가능 */
      --pill-warn-bg: #F6E3DC;   /* 곧 소진 */
      --pill-warn-fg: #B5533C;

      /* ── 모서리 둥글기 ── */
      --radius-lg: 24px;    /* 카드 */
      --radius-md: 14px;    /* 내부 박스/토스트 */
      --radius-sm: 10px;    /* 버튼/입력창/썸네일 */
      --radius-xs: 8px;     /* 작은 버튼 */
      --radius-pill: 99px;  /* 배지/칩 */

      /* ── 그림자 ── */
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.06), 0 12px 32px -12px rgba(90, 64, 38, 0.22);
      --shadow-tab: 0 2px 10px rgba(90, 64, 38, 0.16);
      --shadow-item-hover: 0 6px 18px -8px rgba(15, 23, 42, 0.25);
      --shadow-seg: 0 1px 4px rgba(0, 0, 0, 0.25);
      --shadow-bubble: 0 2px 6px rgba(0, 0, 0, 0.15);

      /* ── 타이포 크기 ── */
      --font-title: 24px;   /* 앱 타이틀 */
      --font-body: 14px;    /* 본문/품목명 */
      --font-sub: 13px;     /* 보조 설명 */
      --font-small: 12px;   /* 배지/작은 텍스트 */
      --font-total: 26px;   /* 합계 금액 */
      /* input은 iOS 줌 방지를 위해 16px 고정 — 토큰화하지 않음 (규칙) */
    }

    /* ── 다크 모드: 색 토큰만 오버라이드 (레이아웃은 그대로) ── */
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0f172a;
        --card: #1e293b;
        --foreground: #f1f5f9;
        --foreground-soft: #cbd5e1;
        --muted-foreground: #94a3b8;
        --secondary: #334155;
        --secondary-soft: #1e293b;
        --border: #334155;
        --border-strong: #475569;
        --brand: #0f172a;
        --brand-gradient: none;
        --on-brand: #f1f5f9;
        --on-brand-soft: rgba(241, 245, 249, 0.75);
        --pill-ok-bg: rgba(52, 211, 153, 0.16);
        --pill-warn-bg: rgba(251, 113, 133, 0.16);
        --pill-warn-fg: #fb7185;
        --glass: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.14);
        --primary: #f8fafc;
        --primary-strong: #e2e8f0;
        --on-primary: #0f172a;
        --success: #34d399;
        --success-strong: #10b981;
        --success-text: #34d399;
        --danger: #fb7185;
        --tint-primary-weak: rgba(248, 250, 252, 0.05);
        --tint-primary-soft: rgba(248, 250, 252, 0.08);
        --tint-primary-medium: rgba(248, 250, 252, 0.08);
        --tint-primary-strong: rgba(248, 250, 252, 0.14);
        --tint-primary-border: rgba(248, 250, 252, 0.2);
        --tint-primary-overlay: rgba(248, 250, 252, 0.05);
        --tint-success-bg: rgba(52, 211, 153, 0.18);
        --tint-success-border: rgba(52, 211, 153, 0.45);
        --tint-success-soft: rgba(52, 211, 153, 0.12);
        --tint-success-note-border: rgba(52, 211, 153, 0.3);
        --tint-danger-bg: rgba(251, 113, 133, 0.18);
        --tint-danger-border: rgba(251, 113, 133, 0.45);
        --pill-short-bg: rgba(251, 191, 36, 0.16);
        --pill-short-fg: #fbbf24;
        --pill-short-border: rgba(251, 191, 36, 0.35);
        --pill-skip-bg: rgba(52, 211, 153, 0.16);
        --pill-skip-fg: #34d399;
        --pill-skip-border: rgba(52, 211, 153, 0.35);
        --pill-buy-bg: rgba(251, 113, 133, 0.16);
        --pill-buy-fg: #fb7185;
        --pill-buy-border: rgba(251, 113, 133, 0.35);
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px -12px rgba(0, 0, 0, 0.6);
        --shadow-item-hover: 0 6px 18px -8px rgba(0, 0, 0, 0.6);
        --shadow-seg: 0 1px 4px rgba(0, 0, 0, 0.5);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--brand);
      background-image: var(--brand-gradient);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px)) 16px;
      line-height: 1.45;
    }
    .container { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-card);
    }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    h1 { font-size: var(--font-title); font-weight: 800; }
    .sub { font-size: var(--font-sub); color: var(--muted-foreground); }
    .btn-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button {
      cursor: pointer;
      font-family: inherit;
      font-size: var(--font-sub);
      font-weight: 600;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: var(--secondary);
      color: var(--foreground);
      transition: transform 0.12s ease, background-color 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.97); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary-strong);
      font-weight: 700;
    }
    .btn-order {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success-strong);
      font-size: var(--font-body);
      font-weight: 800;
      padding: 11px 22px;
    }
    .btn-danger {
      background: var(--tint-danger-bg);
      color: var(--danger);
      border-color: var(--tint-danger-border);
      font-weight: 700;
    }
    .btn-sm { padding: 6px 11px; font-size: var(--font-small); border-radius: var(--radius-xs); }

    /* 메인 탭 (🥬 인벤토리 | 🍳 레시피) */
    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--card);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      padding: 11px 8px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: var(--font-sub);
      font-weight: 700;
      background: transparent;
      color: var(--muted-foreground);
      text-align: center;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-tab);
    }

    /* 섹션 내부 세그먼트 토글 */
    .mode-toggle-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .seg-toggle {
      display: inline-flex;
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--secondary);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }
    .seg-btn {
      white-space: nowrap;
      border: none;
      background: transparent;
      color: var(--muted-foreground);
      padding: 8px 16px;
      border-radius: 9px;
      font-size: var(--font-sub);
      font-weight: 700;
    }
    .seg-btn.active {
      background: var(--card);
      color: var(--foreground);
      box-shadow: var(--shadow-seg);
      border: none;
    }

    .toast {
      background: var(--tint-success-bg);
      border: 1px solid var(--tint-success-border);
      color: var(--success-text);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: var(--font-sub);
      font-weight: 700;
      display: none;
    }
    .upload-box {
      border: 2px dashed var(--border-strong);
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--secondary-soft);
      margin-bottom: 16px;
    }
    .upload-box:hover { border-color: var(--primary); background: var(--tint-primary-weak); }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    input[type="text"], input[type="number"], input[type="date"] {
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--foreground);
      /* iOS 자동 줌인 방지: 모든 input은 16px 이상 유지 (web/CLAUDE.md 규칙) */
      font-size: 16px;
      font-family: inherit;
    }
    input[type="text"] { flex: 1; min-width: 0; }
    input[type="number"] { width: 86px; }

    /* 영수증 검수/수정 스테이징 박스 */
    .review-staging-box {
      background: var(--tint-primary-overlay);
      border: 2px solid var(--primary);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .review-header-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .review-meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .review-field-label {
      font-size: 11px;
      color: var(--muted-foreground);
      margin-bottom: 4px;
      font-weight: 700;
    }
    .review-item-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--background);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: var(--radius-sm);
      flex-wrap: wrap;
    }
    .review-item-row input[type="text"] {
      flex: 1 1 130px;
      font-size: 16px;
      padding: 7px 9px;
    }
    .review-item-row .price-input {
      width: 88px;
      font-size: 16px;
      padding: 7px 8px;
    }
    .review-item-row .cycle-input {
      width: 78px;
      font-size: 16px;
      padding: 7px 8px;
    }

    .item-list { display: flex; flex-direction: column; gap: 10px; }
    .item-card {
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .item-thumb {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      flex-shrink: 0;
      object-fit: cover;
      border: none;
      background: var(--secondary-soft);
    }
    .item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .item-name {
      font-size: var(--font-body);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-days {
      font-size: var(--font-small);
      color: var(--muted-foreground);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      font-size: var(--font-small);
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pill-short {
      background: var(--pill-short-bg);
      color: var(--pill-short-fg);
      border: 1px solid var(--pill-short-border);
    }
    .pill-buy {
      background: var(--pill-buy-bg);
      color: var(--pill-buy-fg);
      border: 1px solid var(--pill-buy-border);
    }
    .pill-skip {
      background: var(--pill-skip-bg);
      color: var(--pill-skip-fg);
      border: 1px solid var(--pill-skip-border);
    }
    .summary-footer {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .total-price { font-size: var(--font-total); font-weight: 800; color: var(--primary); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

    /* 채팅 스타일 */
    .chat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .chip-btn {
      font-size: var(--font-small);
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      background: var(--tint-primary-soft);
      border: 1px solid var(--tint-primary-border);
      color: var(--primary-strong);
      font-weight: 600;
    }
    .chip-btn:hover {
      background: var(--tint-primary-strong);
    }
    .chip-btn.chip-active {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary-strong);
      font-weight: 700;
    }
    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 520px;
      overflow-y: auto;
      padding: 4px 2px 12px 2px;
      margin-bottom: 12px;
    }
    .chat-bubble-user {
      align-self: flex-end;
      background: var(--primary);
      color: var(--on-primary);
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      max-width: 85%;
      font-size: var(--font-body);
      font-weight: 600;
      box-shadow: var(--shadow-bubble);
    }
    .chat-bubble-bot {
      align-self: flex-start;
      background: var(--background);
      border: 1px solid var(--border);
      color: var(--foreground);
      padding: 14px;
      border-radius: 16px 16px 16px 4px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-bot-text {
      font-size: var(--font-body);
      line-height: 1.5;
    }
    .chat-shop-box {
      background: var(--secondary-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-skip-note {
      font-size: var(--font-small);
      color: var(--success-text);
      background: var(--tint-success-soft);
      border: 1px solid var(--tint-success-note-border);
      padding: 8px 10px;
      border-radius: var(--radius-xs);
    }
    .chat-ai-note {
      font-size: 12.5px;
      color: var(--foreground-soft);
      background: var(--tint-primary-medium);
      border-left: 3px solid var(--primary);
      padding: 8px 10px;

  <script>
    (function() {
      "use strict";

      function makeFoodImage(bg1, bg2, emoji) {
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88">' +
          '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0%" stop-color="' + bg1 + '"/>' +
          '<stop offset="100%" stop-color="' + bg2 + '"/>' +
          '</linearGradient></defs>' +
          '<rect width="88" height="88" rx="20" fill="url(#g)"/>' +
          '<text x="44" y="58" font-size="42" text-anchor="middle">' + emoji + '</text>' +
          '</svg>';
        return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
      }

      var ITEM_IMAGES = {
        eggs: makeFoodImage("#fef3c7", "#f59e0b", "🥚"),
        spinach: makeFoodImage("#d1fae5", "#059669", "🥬"),
        milk: makeFoodImage("#e0f2fe", "#0284c7", "🥛"),
        soy_sauce: makeFoodImage("#fde68a", "#78350f", "🍾"),
        tofu: makeFoodImage("#f1f5f9", "#64748b", "🧈"),
        ramen: makeFoodImage("#fee2e2", "#dc2626", "🍜"),
        pasta: makeFoodImage("#fef9c3", "#ca8a04", "🍝"),
        olive_oil: makeFoodImage("#ecfccb", "#65a30d", "🫒"),
        salmon: makeFoodImage("#ffedd5", "#ea580c", "🍣"),
        avocado: makeFoodImage("#dcfce7", "#15803d", "🥑"),
        pork_belly: makeFoodImage("#ffe4e6", "#e11d48", "🥩"),
        green_onion: makeFoodImage("#d1fae5", "#10b981", "🧅"),
        apple: makeFoodImage("#fee2e2", "#e11d48", "🍎"),
        banana: makeFoodImage("#fef9c3", "#eab308", "🍌"),
        bread: makeFoodImage("#fef3c7", "#d97706", "🍞"),
        cheese: makeFoodImage("#fef08a", "#ca8a04", "🧀"),
        coffee: makeFoodImage("#f5f5f4", "#78350f", "☕"),
        garlic: makeFoodImage("#f1f5f9", "#94a3b8", "🧄"),
        potato: makeFoodImage("#fef3c7", "#a16207", "🥔"),
        water: makeFoodImage("#e0f2fe", "#0284c7", "💧"),
        default_item: makeFoodImage("#e2e8f0", "#475569", "🛍️")
      };

      function inferThumbKey(name) {
        var s = String(name || "").toLowerCase();
        if (s.indexOf("계란") !== -1 || s.indexOf("달걀") !== -1 || s.indexOf("egg") !== -1) return "eggs";
        if (s.indexOf("시금치") !== -1 || s.indexOf("배추") !== -1 || s.indexOf("김치") !== -1 || s.indexOf("상추") !== -1 || s.indexOf("양배추") !== -1) return "spinach";
        if (s.indexOf("우유") !== -1 || s.indexOf("milk") !== -1) return "milk";
        if (s.indexOf("간장") !== -1 || s.indexOf("소스") !== -1 || s.indexOf("식초") !== -1) return "soy_sauce";
        if (s.indexOf("두부") !== -1 || s.indexOf("버터") !== -1) return "tofu";
        if (s.indexOf("라면") !== -1 || s.indexOf("국수") !== -1 || s.indexOf("우동") !== -1) return "ramen";
        if (s.indexOf("파스타") !== -1 || s.indexOf("스파게티") !== -1) return "pasta";
        if (s.indexOf("올리브") !== -1 || s.indexOf("식용유") !== -1 || s.indexOf("참기름") !== -1) return "olive_oil";
        if (s.indexOf("연어") !== -1 || s.indexOf("생선") !== -1 || s.indexOf("회") !== -1 || s.indexOf("고등어") !== -1) return "salmon";
        if (s.indexOf("아보카도") !== -1) return "avocado";
        if (s.indexOf("삼겹살") !== -1 || s.indexOf("소고기") !== -1 || s.indexOf("돼지") !== -1 || s.indexOf("닭") !== -1 || s.indexOf("고기") !== -1) return "pork_belly";
        if (s.indexOf("대파") !== -1 || s.indexOf("양파") !== -1 || s.indexOf("파") !== -1) return "green_onion";
        if (s.indexOf("사과") !== -1 || s.indexOf("토마토") !== -1 || s.indexOf("딸기") !== -1) return "apple";
        if (s.indexOf("바나나") !== -1 || s.indexOf("레몬") !== -1) return "banana";
        if (s.indexOf("빵") !== -1 || s.indexOf("베이글") !== -1 || s.indexOf("식빵") !== -1) return "bread";
        if (s.indexOf("치즈") !== -1) return "cheese";
        if (s.indexOf("커피") !== -1 || s.indexOf("원두") !== -1 || s.indexOf("차") !== -1) return "coffee";
        if (s.indexOf("마늘") !== -1) return "garlic";

      // 계약(inventory-state) 필수 필드 보조: boughtDay(상대일)로부터 절대일 역산
      function isoFromDaysAgo(daysAgo) {
        var d = new Date();
        d.setDate(d.getDate() - Math.max(0, daysAgo));
        var yyyy = d.getFullYear();
        var mm = String(d.getMonth() + 1).padStart(2, "0");
        var dd = String(d.getDate()).padStart(2, "0");
        return yyyy + "-" + mm + "-" + dd;
      }

      function getTodayIso() {
        var d = new Date();
        var yyyy = d.getFullYear();
        var mm = String(d.getMonth() + 1).padStart(2, "0");
        var dd = String(d.getDate()).padStart(2, "0");
        return yyyy + "-" + mm + "-" + dd;
      }

      function daysBetweenIso(purchaseDateIso, todayIso) {
        var t1 = Date.parse(purchaseDateIso);
        var t2 = Date.parse(todayIso || getTodayIso());
        if (isNaN(t1) || isNaN(t2)) return 0;
        return Math.max(0, Math.round((t2 - t1) / (1000 * 60 * 60 * 24)));
      }

      function normalizeFoodName(s) {

      // Find an inventory item matching a recipe ingredient keyword (bi-directional containment)
      function findInventoryItemForIngredient(keyword) {
        var k = normalizeFoodName(keyword);
        if (!k) return null;
        for (var i = 0; i < state.items.length; i++) {
          var n = normalizeFoodName(state.items[i].name);
          if (n.indexOf(k) !== -1 || k.indexOf(n) !== -1) {
            return state.items[i];
          }
        }
        return null;

      // Match every recipe against current inventory (HSMM depletion-aware)
      function getRecipeMatches() {
        var matches = [];
        for (var i = 0; i < RECIPES.length; i++) {
          var rc = RECIPES[i];
          var inStock = [];
          var missing = [];
          for (var j = 0; j < rc.ingredients.length; j++) {
            var kw = rc.ingredients[j];
            var found = findInventoryItemForIngredient(kw);
            if (!found) {
              missing.push({ name: kw, status: "없음" });
            } else {
              var ev = evaluateItem(found);
              if (ev.isShort) {
                missing.push({ name: kw, status: "부족" });
              } else {
                inStock.push(found.name);
              }
            }
          }
          matches.push({ recipe: rc, inStock: inStock, missing: missing });
        }
        return matches;
      }

      // Add (or flag) an ingredient on the shopping list. Returns true when applied.
      function addIngredientToBuyList(name) {
        var trimmed = String(name || "").trim();
        if (!trimmed) return false;
        for (var i = 0; i < state.items.length; i++) {
          if (state.items[i].name === trimmed) {
            state.items[i].manualNeedToBuy = true;
            state.items[i].checkedForOrder = true;

          }

          manualNeedToBuy: true,
          isManuallyAdded: true,
          checkedForOrder: true
        });
        return true;
      }

      var STORAGE_KEY = "nuvori_poc_state_v2";

      function loadInitialState() {
        try {
          var raw = window.localStorage && window.localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.items) && parsed.items.length > 0) {
              var persistedSubMode = parsed.subMode;
              var validSubModes = ["inventory", "buy", "receipt", "chat"];
              var persistedDayOffset = typeof parsed.dayOffset === "number" ? parsed.dayOffset : 0;
              // 계약 마이그레이션 (inventory-state v2): lastPurchaseDate는 필수.
              // 레거시 데이터에 누락되면 boughtDay 역산으로 보정한다.
              for (var mi = 0; mi < parsed.items.length; mi++) {
                var legacy = parsed.items[mi];
                if (legacy && (!legacy.lastPurchaseDate || typeof legacy.lastPurchaseDate !== "string")) {
                  legacy.lastPurchaseDate = isoFromDaysAgo(
                    Math.max(0, persistedDayOffset - (typeof legacy.boughtDay === "number" ? legacy.boughtDay : persistedDayOffset))
                  );
                }
              }
              return {
                activeTab: "home",
                subMode: validSubModes.indexOf(persistedSubMode) !== -1 ? persistedSubMode : "inventory",
                recipeMode: parsed.recipeMode === "chat" ? "chat" : "list",
                dayOffset: typeof parsed.dayOffset === "number" ? parsed.dayOffset : 0,
                items: parsed.items,
                receipts: Array.isArray(parsed.receipts) ? parsed.receipts : getDefaultReceipts(),
                pendingReceipt: null
              };
            }
          }
        } catch (e) {}
        return {
          activeTab: "home",       // "home" | "inventory" | "recipe"
          subMode: "inventory",    // "inventory" | "buy" | "receipt" | "chat"
          recipeMode: "list",      // "list" | "chat"
          dayOffset: 0,
          items: getDefaultItems(),
          receipts: getDefaultReceipts(),
          pendingReceipt: null     // Staged receipt waiting for user review/edit before DB commit
        };
      }

      // ====================================================================
      // 저장 전 상태 정규화 — contracts/inventory-state.schema.json 의
      // 필수 필드(id, name, price, cycleDays, boughtDay, lastPurchaseDate)가
      // 누락·파손된 항목은 보정하고, 복구 불가능한 항목은 저장에서 제외한다.
      // 레거시 오염 데이터가 localStorage 로 다시 쓰이는 것을 막는 게 목적.
      // ====================================================================
      var ISO_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

      function normalizeItemForSave(item, index) {
        if (!item || typeof item !== "object") return null;
        var name = typeof item.name === "string" ? item.name.trim() : "";
        if (!name) return null; // 품목명 없음 → 복구 불가, 제외

        var price = Number(item.price);
        var cycleDays = Number(item.cycleDays);
        var boughtDay = Number(item.boughtDay);
        var lastPurchaseDate = (
          typeof item.lastPurchaseDate === "string" && ISO_DATE_RE.test(item.lastPurchaseDate)
        ) ? item.lastPurchaseDate : null;

        // 상대일(boughtDay)과 절대일(lastPurchaseDate) 중 하나만 살아 있어도 나머지를 역산 보정
        if (!lastPurchaseDate && !isNaN(boughtDay)) {
          lastPurchaseDate = isoFromDaysAgo(Math.max(0, state.dayOffset - boughtDay));
        }
        if (isNaN(boughtDay) && lastPurchaseDate) {
          boughtDay = state.dayOffset - daysBetweenIso(lastPurchaseDate, getTodayIso());
        }
        if (!lastPurchaseDate) lastPurchaseDate = getTodayIso();
        if (isNaN(boughtDay)) boughtDay = state.dayOffset;

        return {
          id: (typeof item.id === "string" && item.id) ? item.id : ("item_" + Date.now() + "_" + index),
          thumbKey: (typeof item.thumbKey === "string" && item.thumbKey) ? item.thumbKey : inferThumbKey(name),
          name: name,
          price: (!isNaN(price) && price >= 0) ? price : 0,
          lastStore: (typeof item.lastStore === "string" && item.lastStore) ? item.lastStore : "",
          lastPurchaseDate: lastPurchaseDate,
          cycleDays: (!isNaN(cycleDays) && cycleDays >= 1) ? Math.round(cycleDays) : inferCycleDaysByName(name),
          boughtDay: Math.round(boughtDay),
          manualNeedToBuy: Boolean(item.manualNeedToBuy),
          isManuallyAdded: Boolean(item.isManuallyAdded),
          checkedForOrder: item.checkedForOrder !== false
        };
      }

      function normalizeReceiptForSave(receipt, index) {
        if (!receipt || typeof receipt !== "object" || !Array.isArray(receipt.items)) return null;
        var storeName = typeof receipt.storeName === "string" ? receipt.storeName.trim() : "";
        var purchaseDate = (
          typeof receipt.purchaseDate === "string" && ISO_DATE_RE.test(receipt.purchaseDate)
        ) ? receipt.purchaseDate : null;
        if (!storeName || !purchaseDate) return null;

        var cleanedItems = [];
        for (var i = 0; i < receipt.items.length; i++) {
          var it = receipt.items[i];
          if (!it || typeof it !== "object" || typeof it.name !== "string" || !it.name.trim()) continue;
          var p = Number(it.price);
          var c = Number(it.cycleDays);
          cleanedItems.push({
            id: (typeof it.id === "string") ? it.id : "",
            name: it.name.trim(),
            price: (!isNaN(p) && p >= 0) ? p : 0,
            cycleDays: (!isNaN(c) && c >= 1) ? Math.round(c) : inferCycleDaysByName(it.name)
          });
        }
        if (cleanedItems.length === 0) return null;

        // prevItemMap(되돌리기 스냅샷)도 동일 스키마로 정규화 — 파손 엔트리는 제외
        var prevMap = {};
        if (receipt.prevItemMap && typeof receipt.prevItemMap === "object") {
          for (var key in receipt.prevItemMap) {
            var normPrev = normalizeItemForSave(receipt.prevItemMap[key], index);
            if (normPrev) prevMap[key] = normPrev;
          }
        }

        return {
          id: (typeof receipt.id === "string" && receipt.id) ? receipt.id : ("rcpt_" + Date.now() + "_" + index),
          storeName: storeName,
          purchaseDate: purchaseDate,
          addedItemIds: Array.isArray(receipt.addedItemIds)
            ? receipt.addedItemIds.filter(function(x) { return typeof x === "string"; })
            : [],
          prevItemMap: prevMap,
          items: cleanedItems
        };
      }

      function saveState() {
        try {
          if (window.localStorage) {
            var safeItems = [];
            if (Array.isArray(state.items)) {
              for (var i = 0; i < state.items.length; i++) {
                var normItem = normalizeItemForSave(state.items[i], i);
                if (normItem) safeItems.push(normItem);
              }
            }
            var safeReceipts = [];
            if (Array.isArray(state.receipts)) {
              for (var r = 0; r < state.receipts.length; r++) {
                var normRcpt = normalizeReceiptForSave(state.receipts[r], r);
                if (normRcpt) safeReceipts.push(normRcpt);
              }
            }
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
              subMode: state.subMode,
              recipeMode: state.recipeMode,
              dayOffset: state.dayOffset,
              items: safeItems,
              receipts: safeReceipts
            }));
          }
        } catch (e) {}
      }

      var state = loadInitialState();
      var lastUploadedBase64 = "";

      function getThumb(item) {
        if (ITEM_IMAGES[item.id]) return ITEM_IMAGES[item.id];
        if (item.thumbKey && ITEM_IMAGES[item.thumbKey]) return ITEM_IMAGES[item.thumbKey];
        return ITEM_IMAGES[inferThumbKey(item.name)] || ITEM_IMAGES.default_item;
      }

      function formatDaysAgo(item, elapsed) {
        if (item.isManuallyAdded) return "직접 추가됨";
        if (elapsed <= 0) return "오늘 구매";
        return "산 지 " + elapsed + "일 됨";
      }

      // ====================================================================
      // 3-State Hierarchical HSMM + Asymmetric Bayesian Decision Engine
      // ====================================================================
      // 3-State HSMM 엔진은 model/hsmm-engine.js (window.NuvoriModel)에서 로드됨.
      // inferCycleDaysByName / computeHsmmBelief 호출부는 그대로 전역 참조를 사용한다.
      function evaluateItem(item) {
        return NuvoriModel.evaluateItemForOffset(item, state.dayOffset);
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function createThumbImg(item) {
        var img = document.createElement("img");
        img.className = "item-thumb";
        img.src = getThumb(item);
        img.alt = item.name;
        return img;
      }

      // 아이템 카드 (규칙 §1.2: 썸네일 + 품목명/경과일 + 3종 배지 중 하나) — 인벤토리·홈·사이드 패널 공용
      function createInventoryItemCard(item, ev) {
        var card = el("div", "item-card");
        var left = el("div", "item-left");
        left.appendChild(createThumbImg(item));
        var info = el("div", "item-info");
        info.appendChild(el("div", "item-name", item.name));
        info.appendChild(el("div", "item-days", formatDaysAgo(item, ev.elapsed)));
        left.appendChild(info);
        card.appendChild(left);
        if (ev.isShort) {
          card.appendChild(el("span", "pill pill-short", "⚠️ 부족하다"));
        } else {
          card.appendChild(el("span", "pill pill-skip", "✅ 안 사도 된다"));
        }
        return card;
      }

      // 인벤토리 요약: savedMoney = ✅ 안 사도 된다 품목 가격 합 (renderMainView 와 홈 화면이 공유)
      function computeInventorySummary() {
        var entries = [];
        var shortEntries = [];
        var okEntries = [];
        var savedMoney = 0.0;
        for (var i = 0; i < state.items.length; i++) {
          var item = state.items[i];
          var entry = { item: item, ev: evaluateItem(item) };
          entries.push(entry);
          if (entry.ev.isShort) {
            shortEntries.push(entry);
          } else {
            okEntries.push(entry);
            savedMoney += Number(item.price) || 0;
          }
        }
        // 부족 품목은 소비주기 대비 경과가 큰 순(가장 급한 것 먼저)
        shortEntries.sort(function(a, b) {
          return (b.ev.elapsed / Math.max(1, b.item.cycleDays)) - (a.ev.elapsed / Math.max(1, a.item.cycleDays));
        });
        return { entries: entries, shortEntries: shortEntries, okEntries: okEntries, savedMoney: savedMoney };
      }

      // HSMM belief → 3단계 (퍼센트 대신 단계로만 표시: web/CLAUDE.md §1.1 예외 규칙)
      function getHsmmStage(belief) {
        var b = belief || {};
        var s2 = Number(b.pSurplus) || 0, s1 = Number(b.pNormal) || 0, s0 = Number(b.pDepleted) || 0;
        if (s2 >= s1 && s2 >= s0) return { level: 3, label: "여유" };
        if (s1 >= s0) return { level: 2, label: "보통" };
        return { level: 1, label: "거의 다 씀" };
      }

      function countReceiptsForItem(item) {
        var list = Array.isArray(state.receipts) ? state.receipts : [];
        var n = 0;
        for (var i = 0; i < list.length; i++) {
          var r = list[i];
          var hit = (Array.isArray(r.addedItemIds) && r.addedItemIds.indexOf(item.id) !== -1) ||
            (r.prevItemMap && r.prevItemMap[item.id]);
          if (!hit && Array.isArray(r.items)) {
            for (var j = 0; j < r.items.length; j++) {
              if (r.items[j] && r.items[j].name === item.name) { hit = true; break; }
            }
          }
          if (hit) n++;
        }
        return n;
      }

      function showToast(msg) {

      function isNonGroceryNoise(name) {
        var s = String(name || "").toLowerCase().trim();
        if (!s) return true;
        var noiseKeywords = [
          "tax", "subtotal", "sub-total", "total", "change", "cash", "credit", "visa", "mastercard",
          "bag fee", "paper bag", "plastic bag", "crv", "bottle deposit", "deposit", "coupon", "discount",
          "member savings", "tip", "gratuity", "봉투", "쇼핑백", "종량제", "부가세", "합계", "소계", "할인", "보증금"
        ];
        for (var i = 0; i < noiseKeywords.length; i++) {
          if (s === noiseKeywords[i] || s.indexOf(noiseKeywords[i]) !== -1) {
            return true;
          }
        }
        return false;
      }

      // ====================================================================
      // 1. 영수증 등록 전 확인/수정 (Stage -> Review/Edit -> Commit)
      // 2. 등록된 영수증 되돌리기(Revert/삭제) 및 재수정(Re-edit)
      // ====================================================================
      function openReceiptReviewEditor(draftReceipt) {
        var todayIso = getTodayIso();
        var rawItems = Array.isArray(draftReceipt.items) ? draftReceipt.items : [];
        var cleaned = [];
        for (var i = 0; i < rawItems.length; i++) {
          var it = rawItems[i];
          if (it && it.name && !isNonGroceryNoise(it.name)) {
            cleaned.push({
              id: it.id || "",
              name: String(it.name).trim(),
              price: Number(it.price) > 0 ? Number(it.price) : 4.50,
              cycleDays: Number(it.cycleDays) > 0 ? Number(it.cycleDays) : inferCycleDaysByName(it.name)
            });
          }
        }
        if (cleaned.length === 0) {
          cleaned.push({ id: "", name: "", price: 4.50, cycleDays: 7 });
        }

        state.pendingReceipt = {
          editingReceiptId: draftReceipt.editingReceiptId || null,
          storeName: draftReceipt.storeName || "마트",
          purchaseDate: draftReceipt.purchaseDate || todayIso,
          note: draftReceipt.note || "",
          needsApiKeyRetry: Boolean(draftReceipt.needsApiKeyRetry),
          items: cleaned
        };
        state.activeTab = "inventory";
        state.subMode = "receipt";
        renderAll();
      }

      function revertReceiptFromDB(receiptId, silent) {
        if (!Array.isArray(state.receipts)) return false;
        var targetIdx = -1;
        var targetReceipt = null;
        for (var i = 0; i < state.receipts.length; i++) {
          if (state.receipts[i].id === receiptId) {
            targetIdx = i;
            targetReceipt = state.receipts[i];
            break;
          }
        }
        if (!targetReceipt) return false;

        var addedIds = Array.isArray(targetReceipt.addedItemIds) ? targetReceipt.addedItemIds : [];
        var prevMap = targetReceipt.prevItemMap || {};
        var receiptItemNames = (targetReceipt.items || []).map(function(it) { return it.name; });

        var nextItems = [];
        for (var j = 0; j < state.items.length; j++) {
          var item = state.items[j];
          // 1) If this item was newly added by this receipt, remove it on revert
          if (addedIds.indexOf(item.id) !== -1) {
            continue;
          }
          // 2) If this item existed before and was updated by this receipt, restore its previous state
          if (prevMap[item.id]) {
            nextItems.push(deepClone(prevMap[item.id]));
            continue;
          }
          // 3) Fallback for legacy receipts without addedItemIds: match by item name & purchase date
          if (
            addedIds.length === 0 &&
            Object.keys(prevMap).length === 0 &&
            receiptItemNames.indexOf(item.name) !== -1 &&
            (!item.lastPurchaseDate || item.lastPurchaseDate === targetReceipt.purchaseDate)
          ) {
            continue;
          }
          nextItems.push(item);
        }

        state.items = nextItems;
        state.receipts.splice(targetIdx, 1);

        if (!silent) {
          showToast("↩️ [" + targetReceipt.storeName + " · " + targetReceipt.purchaseDate + "] 영수증이 삭제(Revert)되어 인벤토리에서 되돌려졌습니다.");
          renderAll();
        }
        return true;
      }

      function commitStagedReceiptToDB() {
        var pending = state.pendingReceipt;
        if (!pending) return;

        var storeName = String(pending.storeName || "마트").trim() || "마트";
        var todayIso = getTodayIso();
        var purchaseDate = String(pending.purchaseDate || todayIso).trim() || todayIso;
        var daysAgo = daysBetweenIso(purchaseDate, todayIso);
        var computedBoughtDay = state.dayOffset - daysAgo;

        var validItems = [];
        for (var k = 0; k < pending.items.length; k++) {
          var cand = pending.items[k];
          var trimmedName = String(cand.name || "").trim();
          var parsedPrice = Number(cand.price);
          var parsedCycle = Number(cand.cycleDays);
          if (trimmedName && !isNonGroceryNoise(trimmedName)) {
            validItems.push({
              id: cand.id || "",
              name: trimmedName,
              price: (!isNaN(parsedPrice) && parsedPrice > 0) ? parsedPrice : 4.50,
              cycleDays: (!isNaN(parsedCycle) && parsedCycle >= 1) ? Math.round(parsedCycle) : inferCycleDaysByName(trimmedName)
            });
          }
        }

        if (validItems.length === 0) {
          showToast("⚠️ 최소 1개 이상의 유효한 식료품 품목명을 입력해 주세요.");
          return;
        }

        // Duplicate guard: same store + same purchase date already in DB (skip when editing that receipt)
        var isEditingExisting = Boolean(pending.editingReceiptId);
        if (!isEditingExisting && Array.isArray(state.receipts)) {
          for (var d = 0; d < state.receipts.length; d++) {
            var existing = state.receipts[d];
            if (
              existing &&
              String(existing.storeName) === storeName &&
              String(existing.purchaseDate) === purchaseDate
            ) {
              showToast(
                "⚠️ [" + storeName + " · " + purchaseDate + "] 영수증이 이미 등록되어 있습니다. 저장된 내역에서 '✏️ 수정'을 이용해 주세요."
              );
              return;
            }
          }
        }

        // If editing an existing receipt, revert its previous effect first
        var wasEditing = Boolean(pending.editingReceiptId);
        if (wasEditing) {
          revertReceiptFromDB(pending.editingReceiptId, true);
        }

        var addedItemIds = [];
        var prevItemMap = {};

        for (var i = 0; i < validItems.length; i++) {
          var n = validItems[i];
          var found = null;
          for (var j = 0; j < state.items.length; j++) {
            if ((n.id && state.items[j].id === n.id) || state.items[j].name === n.name) {
              found = state.items[j];
              break;
            }
          }

          if (found) {
            if (!prevItemMap[found.id]) {
              prevItemMap[found.id] = deepClone(found);
            }
            var interval = Math.abs(computedBoughtDay - found.boughtDay);
            if (n.cycleDays && n.cycleDays > 0) {
              found.cycleDays = n.cycleDays;
            } else {
              // Empirical Bayes 주기 갱신은 모델 영역의 정규 구현 사용 (가드 포함)
              found.cycleDays = NuvoriModel.updateCycleDays(found.cycleDays, interval);
            }
            found.boughtDay = computedBoughtDay;
            found.price = n.price;
            found.lastStore = storeName;
            found.lastPurchaseDate = purchaseDate;
            found.manualNeedToBuy = false;
            found.isManuallyAdded = false;
            found.checkedForOrder = true;
          } else {
            var newId = n.id || ("custom_" + Date.now() + "_" + i);
            addedItemIds.push(newId);
            state.items.unshift({
              id: newId,
              thumbKey: inferThumbKey(n.name),
              name: n.name,
              price: n.price,
              lastStore: storeName,
              lastPurchaseDate: purchaseDate,
              cycleDays: n.cycleDays || inferCycleDaysByName(n.name),
              boughtDay: computedBoughtDay,
              manualNeedToBuy: false,
              isManuallyAdded: false,
              checkedForOrder: true
            });
          }
        }

        if (!Array.isArray(state.receipts)) state.receipts = [];
        state.receipts.unshift({
          id: pending.editingReceiptId || ("rcpt_" + Date.now()),
          storeName: storeName,
          purchaseDate: purchaseDate,
          addedItemIds: addedItemIds,
          prevItemMap: prevItemMap,
          items: validItems.map(function(it) {
            return { id: it.id, name: it.name, price: it.price, cycleDays: it.cycleDays };
          })
        });

        state.pendingReceipt = null;
        state.activeTab = "inventory";
        state.subMode = "inventory";
        showToast(
          wasEditing
            ? ("✓ [" + storeName + " · " + purchaseDate + "] 영수증 수정사항이 인벤토리 DB에 반영되었습니다!")
            : ("✓ [" + storeName + " · " + purchaseDate + "] " + validItems.length + "개 품목 확인 및 DB 등록 완료!")
        );
        renderAll();
      }
