<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Nuvori" />
  <meta name="theme-color" content="#dc2626" />
  <link rel="manifest" href="manifest.json" />
  <title>Nuvori — 스마트 장보기</title>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #0f172a;
      --card: #ffffff;
      --border: #e2e8f0;
      --secondary: #f1f5f9;
      --muted-foreground: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #dc2626;
      color: var(--foreground, #0f172a);
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px)) 16px;
      line-height: 1.45;
    }
    .container { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: var(--card, #ffffff);
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    h1 { font-size: 19px; font-weight: 800; }
    .sub { font-size: 13px; color: var(--muted-foreground, #64748b); }
    .btn-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      padding: 8px 14px;
      border: 1px solid var(--border, #e2e8f0);
      background: var(--secondary, #f1f5f9);
      color: var(--foreground, #0f172a);
      transition: all 0.15s;
    }
    button:hover { opacity: 0.92; }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
      font-weight: 700;
    }
    .btn-order {
      background: #10b981;
      color: #ffffff;
      border-color: #059669;
      font-size: 14px;
      font-weight: 800;
      padding: 11px 22px;
    }
    .btn-danger {
      background: rgba(244, 63, 94, 0.16);
      color: #e11d48;
      border-color: rgba(244, 63, 94, 0.4);
      font-weight: 700;
    }
    .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }

    /* Top 3 Main Tabs */
    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      background: var(--card, #ffffff);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border, #e2e8f0);
    }
    .tab-btn {
      padding: 11px 8px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      background: transparent;
      color: var(--muted-foreground, #64748b);
      text-align: center;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
    }

    /* Segmented Toggle inside Tab 1 (인벤토리 <-> 쇼핑 리스트) */
    .mode-toggle-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border, #e2e8f0);
    }
    .seg-toggle {
      display: inline-flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border, #e2e8f0);
    }
    .seg-btn {
      border: none;
      background: transparent;
      color: var(--muted-foreground, #64748b);
      padding: 8px 16px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
    }
    .seg-btn.active {
      background: var(--card, #ffffff);
      color: var(--foreground, #0f172a);
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      border: 1px solid #0284c7;
    }

    .toast {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #047857;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      display: none;
    }
    .upload-box {
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #f8fafc;
      margin-bottom: 16px;
    }
    .upload-box:hover { border-color: #0284c7; background: rgba(2, 132, 199, 0.06); }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    input[type="text"], input[type="number"], input[type="date"] {
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--border, #e2e8f0);
      background: var(--background, #ffffff);
      color: var(--foreground, #0f172a);
      font-size: 15px;
      font-family: inherit;
    }
    input[type="text"] { flex: 1; min-width: 0; }
    input[type="number"] { width: 86px; }

    /* Receipt Review & Edit Staging Box */
    .review-staging-box {
      background: rgba(2, 132, 199, 0.09);
      border: 2px solid #0284c7;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .review-header-title {
      font-size: 15px;
      font-weight: 800;
      color: #0369a1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .review-meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .review-field-label {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .review-item-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--background, #ffffff);
      border: 1px solid var(--border, #e2e8f0);
      padding: 8px;
      border-radius: 10px;
      flex-wrap: wrap;
    }
    .review-item-row input[type="text"] {
      flex: 1 1 130px;
      font-size: 14px;
      padding: 7px 9px;
    }
    .review-item-row .price-input {
      width: 78px;
      font-size: 14px;
      padding: 7px 8px;
    }
    .review-item-row .cycle-input {
      width: 68px;
      font-size: 14px;
      padding: 7px 8px;
    }

    .item-list { display: flex; flex-direction: column; gap: 10px; }
    .item-card {
      background: var(--background, #ffffff);
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .item-thumb {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      flex-shrink: 0;
      object-fit: cover;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .item-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-days {
      font-size: 12px;
      color: var(--muted-foreground, #64748b);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pill-short {
      background: rgba(245, 158, 11, 0.16);
      color: #b45309;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .pill-buy {
      background: rgba(244, 63, 94, 0.16);
      color: #e11d48;
      border: 1px solid rgba(244, 63, 94, 0.35);
    }
    .pill-skip {
      background: rgba(16, 185, 129, 0.16);
      color: #047857;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .summary-footer {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border, #e2e8f0);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .total-price { font-size: 26px; font-weight: 800; color: #0284c7; }

    /* Chat Tab Styles */
    .chat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .chip-btn {
      font-size: 12px;
      padding: 6px 11px;
      border-radius: 99px;
      background: rgba(2, 132, 199, 0.08);
      border: 1px solid rgba(2, 132, 199, 0.28);
      color: #0369a1;
      font-weight: 600;
    }
    .chip-btn:hover {
      background: rgba(2, 132, 199, 0.16);
    }
    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 520px;
      overflow-y: auto;
      padding: 4px 2px 12px 2px;
      margin-bottom: 12px;
    }
    .chat-bubble-user {
      align-self: flex-end;
      background: #0284c7;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      max-width: 85%;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .chat-bubble-bot {
      align-self: flex-start;
      background: var(--background, #ffffff);
      border: 1px solid var(--border, #e2e8f0);
      color: var(--foreground, #0f172a);
      padding: 14px;
      border-radius: 16px 16px 16px 4px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-bot-text {
      font-size: 14px;
      line-height: 1.5;
    }
    .chat-shop-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-skip-note {
      font-size: 12px;
      color: #047857;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 8px 10px;
      border-radius: 8px;
    }
    .chat-ai-note {
      font-size: 12.5px;
      color: #334155;
      background: rgba(2, 132, 199, 0.12);
      border-left: 3px solid #0284c7;
      padding: 8px 10px;
      border-radius: 6px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">

    <!-- 상단 타이틀 + 장보는 날 선택 -->
    <div class="card header-row">
      <h1>🥦 Nuvori 장보기</h1>
      <div class="btn-group" id="day-buttons"></div>
    </div>

    <!-- 2개 메인 섹션: | 🥬 인벤토리 | 🍳 레시피 | -->
    <div class="main-tabs">
      <button id="tab-inventory-btn" type="button" class="tab-btn active">🥬 인벤토리</button>
      <button id="tab-recipe-btn" type="button" class="tab-btn">🍳 레시피</button>
    </div>

    <div id="toast" class="toast"></div>

    <!-- SECTION 1: 🥬 인벤토리 전용 (인벤토리 · 쇼핑 리스트 · 영수증 · 장보기 챗) -->
    <div id="view-inventory" class="card">
      <div class="mode-toggle-wrap">
        <div class="seg-toggle">
          <button id="toggle-inventory" type="button" class="seg-btn active">🥬 인벤토리</button>
          <button id="toggle-buy" type="button" class="seg-btn">🛒 쇼핑</button>
          <button id="toggle-receipt" type="button" class="seg-btn">📸 영수증</button>
          <button id="toggle-chat-inv" type="button" class="seg-btn">💬 챗</button>
        </div>
        <span id="mode-summary-badge" class="pill pill-skip"></span>
      </div>

      <!-- 서브뷰 A: 인벤토리 리스트 -->
      <div id="subview-inventory" class="item-list"></div>

      <!-- 서브뷰 B: 쇼핑 리스트 + 합계 + 주문 -->
      <div id="subview-buy" class="hidden">
        <div class="input-row">
          <input id="input-buy-name" type="text" placeholder="쇼핑 리스트에 새 아이템 직접 입력 (예: 삼겹살, 대파, 커피)" />
          <input id="input-buy-price" type="number" step="0.01" min="0" placeholder="$4.50" />
          <button id="btn-add-buy-item" type="button" class="btn-primary">+ 추가</button>
        </div>

        <div id="buy-list" class="item-list"></div>

        <div class="summary-footer">
          <div>
            <div class="sub">쇼핑 리스트 합계</div>
            <div id="checkout-total" class="total-price">$0.00</div>
          </div>
          <div class="btn-group">
            <button id="btn-copy-list" type="button">📋 리스트 복사</button>
            <button id="btn-order-now" type="button" class="btn-order">🚀 주문하기</button>
          </div>
        </div>
      </div>

      <!-- 서브뷰 C: 영수증 (사진 올리기 + 등록 전 검수/수정 + 저장 내역) -->
      <div id="subview-receipt" class="hidden">
        <label class="upload-box">
          <span style="font-size: 34px;">📷</span>
          <span id="upload-status-title" style="font-size: 15px; font-weight: 700;">영수증 사진 찍기 / 파일 올리기</span>
          <span id="upload-status-sub" class="sub">사진을 올리면 아래에서 품목을 확인·수정한 뒤 등록할 수 있습니다</span>
          <input id="file-upload" type="file" accept="image/*" capture="environment" style="display: none;" />
        </label>

        <!-- 📝 영수증 등록 전 확인 및 수정 (Review & Edit Staging Panel) -->
        <div id="receipt-review-container" class="hidden"></div>

        <div style="border-top: 1px solid var(--border, #334155); padding-top: 14px;">
          <div class="sub" style="font-weight: 700; margin-bottom: 8px;">🗄️ 최근 등록된 영수증 내역 (잘못 등록된 영수증은 [✏️ 수정] 또는 [🗑 삭제] 가능)</div>
          <div id="receipt-db-log" class="item-list"></div>
        </div>
      </div>

      <!-- 서브뷰 D: 장보기 챗 슬롯 (공유 chat-panel 이 도킹됨) -->
      <div id="subview-chat-inv" class="hidden"></div>
    </div>

    <!-- SECTION 2: 🍳 레시피 전용 (재료별 요리 + 요리 질문 챗) -->
    <div id="view-recipe" class="card hidden">
      <div class="mode-toggle-wrap">
        <div class="seg-toggle">
          <button id="toggle-recipe-list" type="button" class="seg-btn active">🍳 요리</button>
          <button id="toggle-chat-recipe" type="button" class="seg-btn">💬 질문</button>
        </div>
      </div>

      <!-- 서브뷰: 재료 기반 요리 목록 -->
      <div id="subview-recipe-list">
        <div class="sub" style="font-weight: 700; margin-bottom: 8px;">🍳 인벤토리 재료로 만들 수 있는 요리</div>
        <div id="recipe-list" class="item-list"></div>
      </div>

      <!-- 서브뷰: 요리 챗 슬롯 (공유 chat-panel 이 도킹됨) -->
      <div id="subview-chat-recipe" class="hidden"></div>
    </div>

    <!-- 💬 공유 챗 패널: 활성 섹션의 챗 슬롯으로 이동 도킹됨 (인벤토리 챗 = 장보기, 레시피 챗 = 요리 추천) -->
    <div id="chat-panel">
      <div class="sub" style="font-weight: 700; margin-bottom: 8px;">💡 원클릭 추천 질문 (누르면 바로 쇼핑 리스트가 나옵니다):</div>
      <div id="chat-quick-chips" class="chat-chips"></div>

      <div id="chat-messages" class="chat-messages"></div>

      <div class="input-row" style="margin-bottom: 0;">
        <input id="input-chat-query" type="text" placeholder="예: 오늘 장본지 3일 됐는데, 뭐 사야돼?" />
        <button id="btn-send-chat" type="button" class="btn-primary">전송</button>
      </div>
    </div>

  </div>

  <!-- 공유 모듈: model/hsmm-engine.js 와 packages/api-client/api-client.js 가
       배포 시 web/ 디렉토리로 복사됨 (netlify.toml의 build command 참조) -->
  <script src="hsmm-engine.js"></script>
  <script src="api-client.js"></script>

  <script>
    (function() {
      "use strict";

      function makeFoodImage(bg1, bg2, emoji) {
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88">' +
          '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0%" stop-color="' + bg1 + '"/>' +
          '<stop offset="100%" stop-color="' + bg2 + '"/>' +
          '</linearGradient></defs>' +
          '<rect width="88" height="88" rx="20" fill="url(#g)"/>' +
          '<text x="44" y="58" font-size="42" text-anchor="middle">' + emoji + '</text>' +
          '</svg>';
        return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
      }

      var ITEM_IMAGES = {
        eggs: makeFoodImage("#fef3c7", "#f59e0b", "🥚"),
        spinach: makeFoodImage("#d1fae5", "#059669", "🥬"),
        milk: makeFoodImage("#e0f2fe", "#0284c7", "🥛"),
        soy_sauce: makeFoodImage("#fde68a", "#78350f", "🍾"),
        tofu: makeFoodImage("#f1f5f9", "#64748b", "🧈"),
        ramen: makeFoodImage("#fee2e2", "#dc2626", "🍜"),
        pasta: makeFoodImage("#fef9c3", "#ca8a04", "🍝"),
        olive_oil: makeFoodImage("#ecfccb", "#65a30d", "🫒"),
        salmon: makeFoodImage("#ffedd5", "#ea580c", "🍣"),
        avocado: makeFoodImage("#dcfce7", "#15803d", "🥑"),
        pork_belly: makeFoodImage("#ffe4e6", "#e11d48", "🥩"),
        green_onion: makeFoodImage("#d1fae5", "#10b981", "🧅"),
        apple: makeFoodImage("#fee2e2", "#e11d48", "🍎"),
        banana: makeFoodImage("#fef9c3", "#eab308", "🍌"),
        bread: makeFoodImage("#fef3c7", "#d97706", "🍞"),
        cheese: makeFoodImage("#fef08a", "#ca8a04", "🧀"),
        coffee: makeFoodImage("#f5f5f4", "#78350f", "☕"),
        garlic: makeFoodImage("#f1f5f9", "#94a3b8", "🧄"),
        potato: makeFoodImage("#fef3c7", "#a16207", "🥔"),
        water: makeFoodImage("#e0f2fe", "#0284c7", "💧"),
        default_item: makeFoodImage("#e2e8f0", "#475569", "🛍️")
      };

      function inferThumbKey(name) {
        var s = String(name || "").toLowerCase();
        if (s.indexOf("계란") !== -1 || s.indexOf("달걀") !== -1 || s.indexOf("egg") !== -1) return "eggs";
        if (s.indexOf("시금치") !== -1 || s.indexOf("배추") !== -1 || s.indexOf("김치") !== -1 || s.indexOf("상추") !== -1 || s.indexOf("양배추") !== -1) return "spinach";
        if (s.indexOf("우유") !== -1 || s.indexOf("milk") !== -1) return "milk";
        if (s.indexOf("간장") !== -1 || s.indexOf("소스") !== -1 || s.indexOf("식초") !== -1) return "soy_sauce";
        if (s.indexOf("두부") !== -1 || s.indexOf("버터") !== -1) return "tofu";
        if (s.indexOf("라면") !== -1 || s.indexOf("국수") !== -1 || s.indexOf("우동") !== -1) return "ramen";
        if (s.indexOf("파스타") !== -1 || s.indexOf("스파게티") !== -1) return "pasta";
        if (s.indexOf("올리브") !== -1 || s.indexOf("식용유") !== -1 || s.indexOf("참기름") !== -1) return "olive_oil";

        return Math.max(0, Math.round((t2 - t1) / (1000 * 60 * 60 * 24)));

      function normalizeFoodName(s) {
        return String(s || "").toLowerCase().replace(/\s+/g, "");

      // Find an inventory item matching a recipe ingredient keyword (bi-directional containment)
      function findInventoryItemForIngredient(keyword) {
        var k = normalizeFoodName(keyword);
        if (!k) return null;
        for (var i = 0; i < state.items.length; i++) {
          var n = normalizeFoodName(state.items[i].name);
          if (n.indexOf(k) !== -1 || k.indexOf(n) !== -1) {
            return state.items[i];
          }
        }
        return null;
      }

      // Match every recipe against current inventory (HSMM depletion-aware)
      function getRecipeMatches() {
        var matches = [];
        for (var i = 0; i < RECIPES.length; i++) {
          var rc = RECIPES[i];
          var inStock = [];
          var missing = [];
          for (var j = 0; j < rc.ingredients.length; j++) {
            var kw = rc.ingredients[j];
            var found = findInventoryItemForIngredient(kw);
            if (!found) {
              missing.push({ name: kw, status: "없음" });
            } else {
              var ev = evaluateItem(found);
              if (ev.isShort) {
                missing.push({ name: kw, status: "부족" });
              } else {
                inStock.push(found.name);
              }
            }
          }
          matches.push({ recipe: rc, inStock: inStock, missing: missing });
        }
        return matches;
      }

          if (state.items[i].name === trimmed) {

        state.items.unshift({

          price: 4.50,

          boughtDay: state.dayOffset - 10,

        });

      // ====================================================================

      // ====================================================================

      // inferCycleDaysByName / computeHsmmBelief 호출부는 그대로 전역 참조를 사용한다.
      function evaluateItem(item) {

      function isNonGroceryNoise(name) {
        var s = String(name || "").toLowerCase().trim();
        if (!s) return true;
        var noiseKeywords = [
          "tax", "subtotal", "sub-total", "total", "change", "cash", "credit", "visa", "mastercard",
          "bag fee", "paper bag", "plastic bag", "crv", "bottle deposit", "deposit", "coupon", "discount",
          "member savings", "tip", "gratuity", "봉투", "쇼핑백", "종량제", "부가세", "합계", "소계", "할인", "보증금"
        ];
        for (var i = 0; i < noiseKeywords.length; i++) {
          if (s === noiseKeywords[i] || s.indexOf(noiseKeywords[i]) !== -1) {
            return true;
          }
        }
        return false;
      }

      // ====================================================================
      // 1. 영수증 등록 전 확인/수정 (Stage -> Review/Edit -> Commit)
      // 2. 등록된 영수증 되돌리기(Revert/삭제) 및 재수정(Re-edit)
      // ====================================================================
      function openReceiptReviewEditor(draftReceipt) {
        var todayIso = getTodayIso();
        var rawItems = Array.isArray(draftReceipt.items) ? draftReceipt.items : [];
        var cleaned = [];
        for (var i = 0; i < rawItems.length; i++) {
          var it = rawItems[i];
          if (it && it.name && !isNonGroceryNoise(it.name)) {
            cleaned.push({
              id: it.id || "",
              name: String(it.name).trim(),
              price: Number(it.price) > 0 ? Number(it.price) : 4.50,
              cycleDays: Number(it.cycleDays) > 0 ? Number(it.cycleDays) : inferCycleDaysByName(it.name)
            });
          }
        }
        if (cleaned.length === 0) {
          cleaned.push({ id: "", name: "", price: 4.50, cycleDays: 7 });
        }

        state.pendingReceipt = {
          editingReceiptId: draftReceipt.editingReceiptId || null,
          storeName: draftReceipt.storeName || "마트",
          purchaseDate: draftReceipt.purchaseDate || todayIso,
          note: draftReceipt.note || "",
          needsApiKeyRetry: Boolean(draftReceipt.needsApiKeyRetry),
          items: cleaned
        };
        state.activeTab = "inventory";
        state.subMode = "receipt";
        renderAll();
      }

      function revertReceiptFromDB(receiptId, silent) {
        if (!Array.isArray(state.receipts)) return false;
        var targetIdx = -1;
        var targetReceipt = null;
        for (var i = 0; i < state.receipts.length; i++) {
          if (state.receipts[i].id === receiptId) {
            targetIdx = i;
            targetReceipt = state.receipts[i];
            break;
          }
        }
        if (!targetReceipt) return false;

        var addedIds = Array.isArray(targetReceipt.addedItemIds) ? targetReceipt.addedItemIds : [];
        var prevMap = targetReceipt.prevItemMap || {};
        var receiptItemNames = (targetReceipt.items || []).map(function(it) { return it.name; });

        var nextItems = [];
        for (var j = 0; j < state.items.length; j++) {
          var item = state.items[j];
          // 1) If this item was newly added by this receipt, remove it on revert
          if (addedIds.indexOf(item.id) !== -1) {
            continue;
          }
          // 2) If this item existed before and was updated by this receipt, restore its previous state
          if (prevMap[item.id]) {
            nextItems.push(deepClone(prevMap[item.id]));
            continue;
          }
          // 3) Fallback for legacy receipts without addedItemIds: match by item name & purchase date
          if (
            addedIds.length === 0 &&
            Object.keys(prevMap).length === 0 &&
            receiptItemNames.indexOf(item.name) !== -1 &&
            (!item.lastPurchaseDate || item.lastPurchaseDate === targetReceipt.purchaseDate)
          ) {
            continue;
          }
          nextItems.push(item);
        }

        state.items = nextItems;
        state.receipts.splice(targetIdx, 1);

        if (!silent) {
          showToast("↩️ [" + targetReceipt.storeName + " · " + targetReceipt.purchaseDate + "] 영수증이 삭제(Revert)되어 인벤토리에서 되돌려졌습니다.");
          renderAll();
        }
        return true;
      }

      function commitStagedReceiptToDB() {
        var pending = state.pendingReceipt;
        if (!pending) return;

        var storeName = String(pending.storeName || "마트").trim() || "마트";
        var todayIso = getTodayIso();
        var purchaseDate = String(pending.purchaseDate || todayIso).trim() || todayIso;
        var daysAgo = daysBetweenIso(purchaseDate, todayIso);
        var computedBoughtDay = state.dayOffset - daysAgo;

        var validItems = [];
        for (var k = 0; k < pending.items.length; k++) {
          var cand = pending.items[k];
          var trimmedName = String(cand.name || "").trim();
          var parsedPrice = Number(cand.price);
          var parsedCycle = Number(cand.cycleDays);
          if (trimmedName && !isNonGroceryNoise(trimmedName)) {
            validItems.push({
              id: cand.id || "",
              name: trimmedName,
              price: (!isNaN(parsedPrice) && parsedPrice > 0) ? parsedPrice : 4.50,
              cycleDays: (!isNaN(parsedCycle) && parsedCycle >= 1) ? Math.round(parsedCycle) : inferCycleDaysByName(trimmedName)
            });
          }
        }

        if (validItems.length === 0) {
          showToast("⚠️ 최소 1개 이상의 유효한 식료품 품목명을 입력해 주세요.");
          return;
        }

        // Duplicate guard: same store + same purchase date already in DB (skip when editing that receipt)
        var isEditingExisting = Boolean(pending.editingReceiptId);
        if (!isEditingExisting && Array.isArray(state.receipts)) {
          for (var d = 0; d < state.receipts.length; d++) {
            var existing = state.receipts[d];
            if (
              existing &&
              String(existing.storeName) === storeName &&
              String(existing.purchaseDate) === purchaseDate
            ) {
              showToast(
                "⚠️ [" + storeName + " · " + purchaseDate + "] 영수증이 이미 등록되어 있습니다. 저장된 내역에서 '✏️ 수정'을 이용해 주세요."
              );
              return;
            }
          }
        }

        // If editing an existing receipt, revert its previous effect first
        var wasEditing = Boolean(pending.editingReceiptId);
        if (wasEditing) {
          revertReceiptFromDB(pending.editingReceiptId, true);
        }

        var addedItemIds = [];
        var prevItemMap = {};

        for (var i = 0; i < validItems.length; i++) {
          var n = validItems[i];
          var found = null;
          for (var j = 0; j < state.items.length; j++) {
            if ((n.id && state.items[j].id === n.id) || state.items[j].name === n.name) {
              found = state.items[j];
              break;
            }
          }

          if (found) {
            if (!prevItemMap[found.id]) {
              prevItemMap[found.id] = deepClone(found);
            }
            var interval = Math.abs(computedBoughtDay - found.boughtDay);
            if (n.cycleDays && n.cycleDays > 0) {
              found.cycleDays = n.cycleDays;
            } else if (interval >= 2 && interval <= 90) {
              found.cycleDays = Math.max(2, Math.round(0.7 * found.cycleDays + 0.3 * interval));
            }
            found.boughtDay = computedBoughtDay;
            found.price = n.price;
            found.lastStore = storeName;
            found.lastPurchaseDate = purchaseDate;
            found.manualNeedToBuy = false;
            found.isManuallyAdded = false;
            found.checkedForOrder = true;
          } else {
            var newId = n.id || ("custom_" + Date.now() + "_" + i);
            addedItemIds.push(newId);
            state.items.unshift({
              id: newId,
              thumbKey: inferThumbKey(n.name),
              name: n.name,
              price: n.price,
              lastStore: storeName,
              lastPurchaseDate: purchaseDate,
              cycleDays: n.cycleDays || inferCycleDaysByName(n.name),
              boughtDay: computedBoughtDay,
              manualNeedToBuy: false,
              isManuallyAdded: false,
              checkedForOrder: true
            });
          }
        }

        if (!Array.isArray(state.receipts)) state.receipts = [];
        state.receipts.unshift({
          id: pending.editingReceiptId || ("rcpt_" + Date.now()),
          storeName: storeName,
          purchaseDate: purchaseDate,
          addedItemIds: addedItemIds,
          prevItemMap: prevItemMap,
          items: validItems.map(function(it) {
            return { id: it.id, name: it.name, price: it.price, cycleDays: it.cycleDays };
          })
        });

        state.pendingReceipt = null;
        state.activeTab = "inventory";
        state.subMode = "inventory";
        showToast(
          wasEditing
            ? ("✓ [" + storeName + " · " + purchaseDate + "] 영수증 수정사항이 인벤토리 DB에 반영되었습니다!")
            : ("✓ [" + storeName + " · " + purchaseDate + "] " + validItems.length + "개 품목 확인 및 DB 등록 완료!")
        );
        renderAll();
      }

      function renderReceiptReviewEditor() {
        var container = document.getElementById("receipt-review-container");
        if (!container) return;
        container.replaceChildren();

        var pending = state.pendingReceipt;
        if (!pending) {
          container.classList.add("hidden");

        container.classList.remove("hidden");

        var box = el("div", "review-staging-box");

        var cancelTopBtn = el("button", "btn-sm", "✕ 닫기");

        if (pending.note) {

        } else {

      function addNewItemToBuyList() {
        var nameInput = document.getElementById("input-buy-name");
        var priceInput = document.getElementById("input-buy-price");
        var name = nameInput.value.trim();
        if (!name) return;

        var parsedPrice = parseFloat(priceInput.value);
        var price = (!isNaN(parsedPrice) && parsedPrice > 0) ? parsedPrice : 4.50;

        var found = null;
        for (var i = 0; i < state.items.length; i++) {
          if (state.items[i].name === name) {
            found = state.items[i];
            break;
          }
        }

        if (found) {
          found.manualNeedToBuy = true;
          found.isManuallyAdded = true;
          found.checkedForOrder = true;
          if (!isNaN(parsedPrice) && parsedPrice > 0) {
            found.price = parsedPrice;
          }
        } else {
          state.items.unshift({
            id: "buy_" + Date.now(),
            thumbKey: inferThumbKey(name),
            name: name,
            price: price,
            cycleDays: 10,
            boughtDay: state.dayOffset - 10,
            manualNeedToBuy: true,
            isManuallyAdded: true,
            checkedForOrder: true
          });
        }

        nameInput.value = "";
        priceInput.value = "";
        state.activeTab = "inventory";
        state.subMode = "buy";
        showToast("🛒 '" + name + "' ($" + price.toFixed(2) + ") 쇼핑 리스트에 추가됨!");
        renderAll();
      }

        var logWrap = document.getElementById("receipt-db-log");
        if (!logWrap) return;
        logWrap.replaceChildren();
        var list = Array.isArray(state.receipts) ? state.receipts : [];
        if (list.length === 0) {
          logWrap.appendChild(el("div", "sub", "등록된 영수증 내역이 없습니다."));
          return;
        }

        // Cumulative summary line
        var totalCount = list.length;
        var totalSpent = list.reduce(function(acc, r) {
          return acc + (r.items || []).reduce(function(a, it) {
            return a + Number(it.price || 0);
          }, 0);
        }, 0);
        logWrap.appendChild(el("div", "sub", "📄 총 " + totalCount + "건 · 총 지출 $" + totalSpent.toFixed(2)));

        var LIST_PAGE_SIZE = 10;
        var visibleCount = receiptLogExpanded ? list.length : Math.min(LIST_PAGE_SIZE, list.length);

        for (var i = 0; i < visibleCount; i++) {
          (function(r) {
            var card = el("div", "item-card");
            var info = el("div", "item-info");
            var itemSummary = (r.items || []).map(function(it) {
              return it.name + "($" + Number(it.price || 0).toFixed(2) + ")";
            }).join(", ");
            var sum = (r.items || []).reduce(function(acc, it) {
              return acc + Number(it.price || 0);
            }, 0);
            info.appendChild(
              el(
                "div",
                "item-name",
                "🏪 " + r.storeName + "  ·  📅 " + r.purchaseDate + "  ·  " + (r.items || []).length + "개 품목 ($" + sum.toFixed(2) + ")"
              )
            );
            info.appendChild(el("div", "item-days", itemSummary));
            card.appendChild(info);

            var actions = el("div", "btn-group");
            var editBtn = el("button", "btn-sm", "✏️ 수정");
            editBtn.type = "button";
            editBtn.addEventListener("click", function() {
              openReceiptReviewEditor({
                editingReceiptId: r.id,
                storeName: r.storeName,
                purchaseDate: r.purchaseDate,
                items: deepClone(r.items || [])
              });
            });
            actions.appendChild(editBtn);

            // 2-step delete: first tap arms, second tap (within 3s) deletes via revert logic
            var deleteBtn = el("button", "btn-danger btn-sm", "🗑 삭제");
            deleteBtn.type = "button";
            var deleteArmed = false;
            var disarmTimer = null;
            deleteBtn.addEventListener("click", function() {
              if (!deleteArmed) {
                deleteArmed = true;
                deleteBtn.textContent = "🗑 다시 눌러 삭제";
                disarmTimer = setTimeout(function() {
                  deleteArmed = false;
                  deleteBtn.textContent = "🗑 삭제";
                }, 3000);
              } else {
                if (disarmTimer) clearTimeout(disarmTimer);
                revertReceiptFromDB(r.id, false);
              }
            });
            actions.appendChild(deleteBtn);

            card.appendChild(actions);
            logWrap.appendChild(card);
          })(list[i]);
        }

        if (list.length > LIST_PAGE_SIZE) {
          var toggleBtn = el("button", "btn-sm", receiptLogExpanded ? "▲ 접기" : "▼ 더보기 (" + (list.length - LIST_PAGE_SIZE) + "건)");
          toggleBtn.type = "button";
          toggleBtn.addEventListener("click", function() {
            receiptLogExpanded = !receiptLogExpanded;
            renderReceiptDbLog();
          });
          logWrap.appendChild(toggleBtn);
        }
      }

        for (var i = 0; i < state.items.length; i++) {
          var it = state.items[i];
          var ev = evaluateItem(it);
          if (ev.isShort && it.checkedForOrder !== false) {
            it.boughtDay = state.dayOffset;
            it.manualNeedToBuy = false;
            it.isManuallyAdded = false;
            orderedCount++;
            totalPaid += it.price;
          }
        }
        if (orderedCount === 0) {
          showToast("주문할 품목이 없습니다.");
          return;

        state.activeTab = "inventory";
        state.subMode = "inventory";

        renderAll();
      }

      function extractChatIntent(rawText) {
        var text = String(rawText || "").trim();
        var detectedDays = null;

        var dayMatch = text.match(/(\d+)\s*일\s*(됐|되|지났|경과|뒤|후|차|째)?/);
        var weekMatch = text.match(/(\d+)\s*주\s*(됐|되|지났|경과|뒤|후|차|째)?/);
        if (dayMatch) {
          detectedDays = Math.min(60, Math.max(0, parseInt(dayMatch[1], 10)));
        } else if (weekMatch) {
          detectedDays = Math.min(60, Math.max(0, parseInt(weekMatch[1], 10) * 7));
        } else if (text.indexOf("일주일") !== -1) {
          detectedDays = 7;
        } else if (text.indexOf("보름") !== -1 || text.indexOf("2주") !== -1) {
          detectedDays = 14;
        } else if (text.indexOf("사흘") !== -1) {
          detectedDays = 3;
        } else if (text.indexOf("이틀") !== -1) {
          detectedDays = 2;
        } else if (text.indexOf("나흘") !== -1) {
          detectedDays = 4;
        } else if (text.indexOf("닷새") !== -1) {
          detectedDays = 5;
        } else if (text.indexOf("열흘") !== -1) {
          detectedDays = 10;
        } else if (text.indexOf("오늘 기준") !== -1 || text.indexOf("당장") !== -1) {
          detectedDays = 0;
        }

        var depletedItemName = null;
        var asksDepleted = (
          text.indexOf("다 먹") !== -1 ||
          text.indexOf("떨어졌") !== -1 ||
          text.indexOf("없어") !== -1 ||
          text.indexOf("추가") !== -1 ||
          (text.indexOf("사야") !== -1 && text.indexOf("뭐") === -1 && text.indexOf("무엇") === -1)
        );
        if (asksDepleted) {
          for (var i = 0; i < state.items.length; i++) {
            var shortNoun = state.items[i].name.split(" ")[0];
            if (text.indexOf(state.items[i].name) !== -1 || (shortNoun.length >= 2 && text.indexOf(shortNoun) !== -1)) {
              state.items[i].manualNeedToBuy = true;
              state.items[i].isManuallyAdded = true;
              state.items[i].checkedForOrder = true;
              depletedItemName = state.items[i].name;
              break;
            }
          }
        }

        var lowConsumptionWeek = (
          text.indexOf("외식") !== -1 ||
          text.indexOf("배달") !== -1 ||
          text.indexOf("집밥 1") !== -1 ||
          text.indexOf("집밥 2") !== -1 ||
          text.indexOf("조금만") !== -1 ||
          text.indexOf("바빠") !== -1
        );

        return {
          detectedDays: detectedDays,
          depletedItemName: depletedItemName,
          lowConsumptionWeek: lowConsumptionWeek
        };
      }

      function buildShoppingListBubble(userQuery, intentResult) {
        var botBubble = el("div", "chat-bubble-bot");

        var dayLabel = state.dayOffset === 0 ? "오늘(기준일)" : ("장본 지 +" + state.dayOffset + "일 경과");
        var buyEntries = [];
        var skipEntries = [];
        var holdPerishables = [];
        var totalCost = 0.0;
        var savedCost = 0.0;

        for (var i = 0; i < state.items.length; i++) {
          var item = state.items[i];
          var ev = evaluateItem(item);
          if (ev.isShort) {
            if (intentResult.lowConsumptionWeek && item.cycleDays <= 6 && !item.manualNeedToBuy) {
              holdPerishables.push(item);
              skipEntries.push({ item: item, ev: ev });
              savedCost += item.price;
            } else {
              buyEntries.push({ item: item, ev: ev });
              totalCost += item.price;
            }
          } else {
            skipEntries.push({ item: item, ev: ev });
            savedCost += item.price;
          }
        }

        var headerMsg = "";
        if (intentResult.depletedItemName) {
          headerMsg = "✅ '" + intentResult.depletedItemName + "' 품목을 쇼핑 리스트에 반영했습니다! ";
        }
        if (intentResult.lowConsumptionWeek) {
          headerMsg += "🍽️ [외식 다수 · 저소비 주간 모드] 이번 주 예상 소비량이 적으므로 단기 부패 신선식품(" +
            (holdPerishables.map(function(p) { return p.name; }).join(", ") || "잎채소류") +
            ")은 폐기 방지를 위해 제외하고 꼭 필요한 " + buyEntries.length + "개($" + totalCost.toFixed(2) + ")만 추렸습니다:";
        } else if (intentResult.detectedDays !== null) {
          headerMsg += "⏱️ 시점을 [" + dayLabel + "]로 이동해 소진 예측(HSMM)을 계산한 결과, 사야 할 품목은 " + buyEntries.length + "개($" + totalCost.toFixed(2) + ")입니다:";
        } else {
          headerMsg += "📊 현재 [" + dayLabel + "] 기준 사야 할 쇼핑 리스트는 " + buyEntries.length + "개($" + totalCost.toFixed(2) + ")입니다:";
        }
        botBubble.appendChild(el("div", "chat-bot-text", headerMsg));

        var shopBox = el("div", "chat-shop-box");
        if (buyEntries.length === 0) {
          shopBox.appendChild(el("div", "sub", "현재 사야 할 부족 품목이 없습니다! 모든 식재료가 집에 충분합니다."));
        } else {
          for (var b = 0; b < buyEntries.length; b++) {
            var entry = buyEntries[b];
            var row = el("div", "item-card");
            row.style.padding = "9px 12px";

            var left = el("div", "item-left");
            left.appendChild(createThumbImg(entry.item));
            var info = el("div", "item-info");
            info.appendChild(el("div", "item-name", entry.item.name));
            var depPct = Math.round(entry.ev.belief.pDepleted * 100);
            var subDesc = formatDaysAgo(entry.item, entry.ev.elapsed) + " · 고갈확률 " + depPct + "% (주기 " + entry.item.cycleDays + "일)";
            info.appendChild(el("div", "item-days", subDesc));
            left.appendChild(info);
            row.appendChild(left);

            var right = el("div", "btn-group");
            right.appendChild(el("span", "pill pill-buy", "🛒 사야 한다"));
            right.appendChild(el("span", "item-name", "$" + entry.item.price.toFixed(2)));
            row.appendChild(right);

            shopBox.appendChild(row);
          }
        }

        if (skipEntries.length > 0) {
          var skipNames = skipEntries.map(function(s) { return s.item.name; }).join(", ");
          shopBox.appendChild(
            el(
              "div",
              "chat-skip-note",
              "✅ 집에 아직 충분하거나 구매 보류로 아낀 품목 (" + skipEntries.length + "개 · $" + savedCost.toFixed(2) + " 절약): " + skipNames
            )
          );
        }

        var footerRow = el("div", "header-row");
        footerRow.style.marginTop = "4px";
        footerRow.appendChild(el("div", "item-name", "🛒 쇼핑 리스트 합계: $" + totalCost.toFixed(2)));

        var actionGroup = el("div", "btn-group");
        var btnGoBuyTab = el("button", "btn-sm", "🛒 쇼핑 리스트 탭 열기");
        btnGoBuyTab.type = "button";
        btnGoBuyTab.addEventListener("click", function() {
          state.activeTab = "inventory";
          state.subMode = "buy";
          renderAll();
        });
        actionGroup.appendChild(btnGoBuyTab);

        if (buyEntries.length > 0) {
          var btnQuickOrder = el("button", "btn-primary btn-sm", "🚀 바로 주문 완료");
          btnQuickOrder.type = "button";
          btnQuickOrder.addEventListener("click", function() {
            executeOrderNow();
          });
          actionGroup.appendChild(btnQuickOrder);
        }
        footerRow.appendChild(actionGroup);
        shopBox.appendChild(footerRow);

        botBubble.appendChild(shopBox);

        var fastSpoilInBuy = buyEntries.filter(function(e) { return e.item.cycleDays <= 6; }).map(function(e) { return e.item.name; });
        var inStockFresh = skipEntries.filter(function(e) { return e.item.cycleDays <= 10; }).map(function(e) { return e.item.name; });
        var dynamicTip = "💡 소비 기반 장보기 팁: ";
        if (fastSpoilInBuy.length > 0) {
          dynamicTip += "구매 리스트의 [" + fastSpoilInBuy.join(", ") + "]은(는) 4~5일 내 부패 위험이 높으니 이번 주 최소 2끼 이상 소비할 계획일 때만 담으세요.";
        } else {
          dynamicTip += "이번 리스트는 보관 주기가 비교적 긴 필수 스테이플 위주여서 부패로 버릴 위험이 낮습니다.";
        }
        if (inStockFresh.length > 0) {
          dynamicTip += " 집에 남아 있는 [" + inStockFresh.join(", ") + "]을(를) 오늘·내일 저녁에 먼저 소진하는 것을 추천합니다.";
        }

        var aiNote = el("div", "chat-ai-note", dynamicTip);
        botBubble.appendChild(aiNote);

        if (userQuery) {
          var invSummary = state.items.map(function(it) {
            var ev = evaluateItem(it);
            return {
              name: it.name,
              elapsed: ev.elapsed,
              cycleDays: it.cycleDays,
              pDepleted: Math.round(ev.belief.pDepleted * 100),
              isShort: ev.isShort
            };
          });
          var rcptHistory = (Array.isArray(state.receipts) ? state.receipts : [])
            .slice(0, 5)
            .map(function(r) {
              return {
                storeName: r.storeName,
                purchaseDate: r.purchaseDate,
                items: (r.items || []).slice(0, 15).map(function(it) {
                  return { name: it.name, price: Number(it.price || 0) };
                })
              };
            });
          var recipeMatches = getRecipeMatches();
          var makeableRecipes = [];
          var nearMissRecipes = [];
          for (var rm = 0; rm < recipeMatches.length; rm++) {
            if (recipeMatches[rm].missing.length === 0) {
              makeableRecipes.push(recipeMatches[rm].recipe.name);
            } else if (recipeMatches[rm].missing.length <= 2) {
              nearMissRecipes.push(
                recipeMatches[rm].recipe.name +
                " (부족: " +
                recipeMatches[rm].missing.map(function(x) { return x.name; }).join(", ") +
                ")"
              );
            }
          }
          NuvoriAPI.chatAdvisor({
            message: userQuery,
            dayOffset: state.dayOffset,
            inventorySummary: invSummary,
            receiptHistory: rcptHistory,
            makeableRecipes: makeableRecipes.slice(0, 8),
            nearMissRecipes: nearMissRecipes.slice(0, 5)
          })
          .then(function(data) {
            if (data && data.reply) {
              aiNote.textContent = "🤖 AI 코치: " + data.reply;
            }
          })
          .catch(function() {});
        }

        return botBubble;
      }

      function handleChatSubmit(customText) {
        var input = document.getElementById("input-chat-query");
        var text = typeof customText === "string" ? customText : input.value.trim();
        if (!text) return;
        if (typeof customText !== "string") {
          input.value = "";
        }

        var msgContainer = document.getElementById("chat-messages");
        msgContainer.appendChild(el("div", "chat-bubble-user", text));

        var intent = extractChatIntent(text);
        if (intent.detectedDays !== null) {
          state.dayOffset = intent.detectedDays;
        }

        renderDayButtons();
        renderMainView();

        var botReplyBubble = buildShoppingListBubble(text, intent);
        msgContainer.appendChild(botReplyBubble);
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }

      function initChatView() {
        var chipsWrap = document.getElementById("chat-quick-chips");
        chipsWrap.replaceChildren();
        for (var i = 0; i < CHAT_QUICK_PROMPTS.length; i++) {
          (function(promptText) {
            var chip = el("button", "chip-btn", "💬 " + promptText);
            chip.type = "button";
            chip.addEventListener("click", function() {
              handleChatSubmit(promptText);
            });
            chipsWrap.appendChild(chip);
          })(CHAT_QUICK_PROMPTS[i]);
        }

        var msgContainer = document.getElementById("chat-messages");
        if (msgContainer.childNodes.length === 0) {
          var welcome = el("div", "chat-bubble-bot");
          welcome.appendChild(
            el(
              "div",
              "chat-bot-text",
              "안녕하세요! 장본 지 며칠 지났는지 말씀하시거나 \"오늘 장본지 3일 됐는데, 뭐 사야돼?\"처럼 물어보시면 3-State HSMM 소진 예측을 돌려 사야 할 쇼핑 리스트를 바로 보여드립니다."
            )
          );
          msgContainer.appendChild(welcome);
        }
      }

      function renderAll() {
        if (state.activeTab !== "recipe") state.activeTab = "inventory";

        var tabInvBtn = document.getElementById("tab-inventory-btn");
        var tabRcpBtn = document.getElementById("tab-recipe-btn");
        var viewInventory = document.getElementById("view-inventory");
        var viewRecipe = document.getElementById("view-recipe");

        tabInvBtn.className = state.activeTab === "inventory" ? "tab-btn active" : "tab-btn";
        tabRcpBtn.className = state.activeTab === "recipe" ? "tab-btn active" : "tab-btn";
        viewInventory.classList.toggle("hidden", state.activeTab !== "inventory");
        viewRecipe.classList.toggle("hidden", state.activeTab !== "recipe");

        // Dock the shared chat panel into the active section's chat slot
        // (appendChild on a different parent moves the node — one chat, two doors)
        var chatPanel = document.getElementById("chat-panel");
        var chatSlot = state.activeTab === "recipe"
          ? document.getElementById("subview-chat-recipe")
          : document.getElementById("subview-chat-inv");
        if (chatPanel && chatSlot && chatPanel.parentNode !== chatSlot) {
          chatSlot.appendChild(chatPanel);
        }

        renderDayButtons();
        renderReceiptReviewEditor();
        renderReceiptDbLog();
        renderMainView();
        renderRecipeView();
      }

      // Wire Tabs & Toggles
      document.getElementById("tab-inventory-btn").addEventListener("click", function() {
        state.activeTab = "inventory";
        renderAll();
      });

      document.getElementById("tab-recipe-btn").addEventListener("click", function() {
        state.activeTab = "recipe";
        renderAll();
      });

      document.getElementById("toggle-inventory").addEventListener("click", function() {
        state.subMode = "inventory";
        renderAll();
      });

      document.getElementById("toggle-buy").addEventListener("click", function() {
        state.subMode = "buy";
        renderAll();
      });

      document.getElementById("toggle-receipt").addEventListener("click", function() {
        state.subMode = "receipt";
        renderAll();
      });

      document.getElementById("toggle-chat-inv").addEventListener("click", function() {
        state.subMode = "chat";
        renderAll();
      });

      document.getElementById("toggle-recipe-list").addEventListener("click", function() {
        state.recipeMode = "list";
        renderAll();
      });

      document.getElementById("toggle-chat-recipe").addEventListener("click", function() {
        state.recipeMode = "chat";
        renderAll();
      });

      document.getElementById("btn-send-chat").addEventListener("click", function() {
        handleChatSubmit();
      });

      document.getElementById("input-chat-query").addEventListener("keydown", function(ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          handleChatSubmit();
        }
      });

      function compressImageToBase64(file, callback) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() {
            var maxDim = 1600;
            var w = img.width;
            var h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round(h * (maxDim / w));
                w = maxDim;
              } else {
                w = Math.round(w * (maxDim / h));
                h = maxDim;
              }
            }
            var canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            var dataUrl = canvas.toDataURL("image/jpeg", 0.88);
            var base64Data = dataUrl.split(",")[1];
            callback(null, base64Data);
          };
          img.onerror = function() { callback(new Error("이미지 로드 실패")); };
          img.src = e.target.result;
        };
        reader.onerror = function() { callback(new Error("파일 읽기 실패")); };
        reader.readAsDataURL(file);
      }

      function requestReceiptOcr(base64Jpeg) {
        var statusTitle = document.getElementById("upload-status-title");
        var statusSub = document.getElementById("upload-status-sub");
        statusTitle.textContent = "⏳ 영수증 AI 분석 중...";
        statusSub.textContent = "인식 완료 후 바로 등록되지 않고 확인/수정 창이 열립니다";

        var existingNames = state.items.map(function(it) { return it.name; });
        NuvoriAPI.parseReceipt({
          imageBase64: base64Jpeg,
          mimeType: "image/jpeg",
          existingNames: existingNames,
          todayIso: getTodayIso()
        })
        .then(function(parsed) {
          statusTitle.textContent = "영수증 사진 찍기 / 파일 올리기";
          statusSub.textContent = "사진을 올리면 아래에서 품목을 확인·수정한 뒤 등록할 수 있습니다";
          if (!parsed || parsed.isValidGroceryReceipt === false || !Array.isArray(parsed.items) || parsed.items.length === 0) {
            var reasonMsg = (parsed && parsed.reason)
              ? parsed.reason
              : "식료품 영수증이 아니거나 식재료 항목을 찾을 수 없습니다.";
            showToast("⚠️ 자동 인식 제외: " + reasonMsg + " (필요 시 아래에서 직접 수정·추가 가능)");
            openReceiptReviewEditor({
              storeName: (parsed && parsed.storeName) || "마트",
              purchaseDate: (parsed && parsed.purchaseDate) || getTodayIso(),
              note: "⚠️ AI 판별 메모: " + reasonMsg + " — 직접 품목을 입력하거나 [✕ 닫기]를 눌러 취소하세요.",
              items: [{ id: "", name: "", price: 4.50, cycleDays: 7 }]
            });
            return;
          }
          showToast("🔍 영수증 " + parsed.items.length + "개 품목 인식 완료! 내용을 확인·수정한 뒤 등록을 눌러주세요.");
          openReceiptReviewEditor({
            storeName: parsed.storeName || "마트",
            purchaseDate: parsed.purchaseDate || getTodayIso(),
            items: parsed.items
          });
        })
        .catch(function(errObj) {
          statusTitle.textContent = "영수증 사진 찍기 / 파일 올리기";
          statusSub.textContent = "사진을 올리면 아래에서 품목을 확인·수정한 뒤 등록할 수 있습니다";
          var errMsg = (errObj && errObj.message) ? errObj.message : "서버 연결 실패";
          var isKeyInvalid = errMsg.indexOf("API key not valid") !== -1 || errMsg.indexOf("GEMINI_API_KEY") !== -1;
          showToast("⚠️ 영수증 자동 파싱 오류(" + errMsg + ") — 아래 확인 창에서 직접 수정하거나 다시 파싱할 수 있습니다.");
          openReceiptReviewEditor({
            storeName: "마트",
            purchaseDate: getTodayIso(),
            needsApiKeyRetry: isKeyInvalid,
            note: isKeyInvalid
              ? "⚠️ 현재 Netlify 환경변수(GEMINI_API_KEY)가 유효하지 않습니다('API key not valid'). Netlify 환경변수에 유효한 키를 설정한 뒤 [🔄 사진 다시 파싱]을 누르거나, 품목을 직접 입력해 등록하세요."
              : ("⚠️ 영수증 자동 파싱 중 오류(" + errMsg + ")가 발생했습니다. [🔄 사진 다시 파싱]을 누르거나 품목을 직접 입력해 등록하세요."),
            items: [{ id: "", name: "", price: 4.50, cycleDays: 7 }]
          });
        });
      }

      document.getElementById("file-upload").addEventListener("change", function(ev) {
        var file = ev.target.files && ev.target.files[0];
        if (!file) return;

        var statusTitle = document.getElementById("upload-status-title");
        var statusSub = document.getElementById("upload-status-sub");
        statusTitle.textContent = "⏳ 영수증 사진 압축 중...";
        statusSub.textContent = "인식 완료 후 바로 등록되지 않고 확인/수정 창이 열립니다";

        compressImageToBase64(file, function(err, base64Jpeg) {
          if (err || !base64Jpeg) {
            statusTitle.textContent = "영수증 사진 찍기 / 파일 올리기";
            statusSub.textContent = "사진을 올리면 아래에서 품목을 확인·수정한 뒤 등록할 수 있습니다";
            openReceiptReviewEditor({
              storeName: "마트",
              purchaseDate: getTodayIso(),
              note: "⚠️ 이미지 읽기에 실패하여 직접 입력/수정 모드로 열렸습니다.",
              items: [{ id: "", name: "", price: 4.50, cycleDays: 7 }]
            });
            return;
          }

          lastUploadedBase64 = base64Jpeg;
          requestReceiptOcr(base64Jpeg);
        });

        ev.target.value = "";
      });

      document.getElementById("btn-add-buy-item").addEventListener("click", addNewItemToBuyList);
      document.getElementById("input-buy-name").addEventListener("keydown", function(ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          addNewItemToBuyList();
        }
      });
      document.getElementById("input-buy-price").addEventListener("keydown", function(ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          addNewItemToBuyList();
        }
      });

      document.getElementById("btn-order-now").addEventListener("click", executeOrderNow);

      document.getElementById("btn-copy-list").addEventListener("click", function() {
        var lines = ["[Nuvori 구매 리스트]"];
        var total = 0.0;
        for (var i = 0; i < state.items.length; i++) {
          var it = state.items[i];
          var ev = evaluateItem(it);
          if (ev.isShort && it.checkedForOrder !== false) {
            lines.push("- " + it.name + " ($" + it.price.toFixed(2) + ")");
            total += it.price;
          }
        }
        lines.push("합계: $" + total.toFixed(2));
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(lines.join("\n"));
        }
        showToast("📋 구매 리스트가 복사되었습니다!");
      });

      initChatView();
      renderAll();
    })();
  </script>
