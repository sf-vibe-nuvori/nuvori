      var receiptLogExpanded = false;
      var receiptStoreFilter = null; // 매장별 필터 (세션 변수 — localStorage 저장 안 함, null = 전체)

      function renderReceiptDbLog() {
        var logWrap = document.getElementById("receipt-db-log");
        if (!logWrap) return;
        logWrap.replaceChildren();
        var list = Array.isArray(state.receipts) ? state.receipts : [];
        if (list.length === 0) {
          var emptyLog = el("div", "sub", "아직 등록된 영수증이 없어요. 위 📷 박스를 눌러 영수증 사진을 올리면 품목을 자동 인식해 인벤토리에 추가해 드립니다.");
          emptyLog.style.padding = "16px";
          emptyLog.style.textAlign = "center";
          logWrap.appendChild(emptyLog);
          return;
        }

        // 저장된 상점명 목록 (중복 제거, 첫 등록 순서 유지)
        var storeNames = [];
        for (var s = 0; s < list.length; s++) {
          var sn = String((list[s] && list[s].storeName) || "").trim();
          if (sn && storeNames.indexOf(sn) === -1) storeNames.push(sn);
        }
        // 선택한 매장의 영수증이 전부 삭제되는 등으로 사라졌으면 필터를 전체로 되돌림
        if (receiptStoreFilter && storeNames.indexOf(receiptStoreFilter) === -1) {
          receiptStoreFilter = null;
        }
        var filtered = receiptStoreFilter
          ? list.filter(function(r) { return String(r.storeName || "").trim() === receiptStoreFilter; })
          : list;

        // 매장별 필터 칩 ('전체' + 저장된 상점명) — 텍스트 칩이므로 게이지바 금지 규칙과 무관
        if (storeNames.length > 1) {
          var chipsWrap = el("div", "chat-chips");
          var chipDefs = [{ label: "전체", value: null }];
          for (var c = 0; c < storeNames.length; c++) {
            chipDefs.push({ label: storeNames[c], value: storeNames[c] });
          }
          for (var cd = 0; cd < chipDefs.length; cd++) {
            (function(chipDef) {
              var isActive = receiptStoreFilter === chipDef.value;
              var chip = el("button", isActive ? "chip-btn chip-active" : "chip-btn", chipDef.label);
              chip.type = "button";
              chip.addEventListener("click", function() {
                receiptStoreFilter = chipDef.value;
                renderReceiptDbLog();
              });
              chipsWrap.appendChild(chip);
            })(chipDefs[cd]);
          }
          logWrap.appendChild(chipsWrap);
        }

        // Cumulative summary line (필터 적용된 목록 기준)
        var totalCount = filtered.length;
        var totalSpent = filtered.reduce(function(acc, r) {
          return acc + (r.items || []).reduce(function(a, it) {
            return a + Number(it.price || 0);
          }, 0);
        }, 0);
        var summaryText = receiptStoreFilter
          ? ("📄 [" + receiptStoreFilter + "] " + totalCount + "건 · 지출 $" + totalSpent.toFixed(2))
          : ("📄 총 " + totalCount + "건 · 총 지출 $" + totalSpent.toFixed(2));
        logWrap.appendChild(el("div", "sub", summaryText));

        if (filtered.length === 0) {
          var emptyFiltered = el("div", "sub", "이 매장에 등록된 영수증이 없습니다.");
          emptyFiltered.style.padding = "16px";
          emptyFiltered.style.textAlign = "center";
          logWrap.appendChild(emptyFiltered);
          return;
        }

        var LIST_PAGE_SIZE = 10;
        var visibleCount = receiptLogExpanded ? filtered.length : Math.min(LIST_PAGE_SIZE, filtered.length);

        for (var i = 0; i < visibleCount; i++) {
          (function(r) {
            var card = el("div", "item-card");
            var info = el("div", "item-info");
            var itemSummary = (r.items || []).map(function(it) {
              return it.name + "($" + Number(it.price || 0).toFixed(2) + ")";
            }).join(", ");
            var sum = (r.items || []).reduce(function(acc, it) {
              return acc + Number(it.price || 0);
            }, 0);
            info.appendChild(
              el(
                "div",
                "item-name",
                "🏪 " + r.storeName + "  ·  📅 " + r.purchaseDate + "  ·  " + (r.items || []).length + "개 품목 ($" + sum.toFixed(2) + ")"
              )
            );
            info.appendChild(el("div", "item-days", itemSummary));
            card.appendChild(info);

            var actions = el("div", "btn-group");
            var editBtn = el("button", "btn-sm", "✏️ 수정");
            editBtn.type = "button";
            editBtn.addEventListener("click", function() {
              openReceiptReviewEditor({
                editingReceiptId: r.id,
                storeName: r.storeName,
                purchaseDate: r.purchaseDate,
                items: deepClone(r.items || [])
              });
            });
            actions.appendChild(editBtn);

            // 2-step delete: first tap arms, second tap (within 3s) deletes via revert logic
            var deleteBtn = el("button", "btn-danger btn-sm", "🗑 삭제");
            deleteBtn.type = "button";
            var deleteArmed = false;
            var disarmTimer = null;
            deleteBtn.addEventListener("click", function() {
              if (!deleteArmed) {
                deleteArmed = true;
                deleteBtn.textContent = "🗑 다시 눌러 삭제";
                disarmTimer = setTimeout(function() {
                  deleteArmed = false;
                  deleteBtn.textContent = "🗑 삭제";
                }, 3000);
              } else {
                if (disarmTimer) clearTimeout(disarmTimer);
                revertReceiptFromDB(r.id, false);
              }
            });
            actions.appendChild(deleteBtn);

            card.appendChild(actions);
            logWrap.appendChild(card);
          })(filtered[i]);
        }

        if (filtered.length > LIST_PAGE_SIZE) {
          var toggleBtn = el("button", "btn-sm", receiptLogExpanded ? "▲ 접기" : "▼ 더보기 (" + (filtered.length - LIST_PAGE_SIZE) + "건)");
          toggleBtn.type = "button";
          toggleBtn.addEventListener("click", function() {
            receiptLogExpanded = !receiptLogExpanded;
            renderReceiptDbLog();
          });
          logWrap.appendChild(toggleBtn);
        }
      }

      function describeRecipeMatch(match) {
        if (match.missing.length === 0) return "재료: " + match.inStock.join(", ");
        var missingNames = match.missing.map(function(m) {
          return m.name + (m.status === "부족" ? "(곧 소진)" : "");
        });
        return "부족: " + missingNames.join(", ");
      }

      function createRecipeStatusPill(match) {
        return match.missing.length === 0
          ? el("span", "rpill rpill-ok", "바로 가능")
          : el("span", "rpill", match.missing.length + "개 부족");
      }

      function createRecipeCard(match) {
        var rc = match.recipe;
        var card = el("div", "recipe-card");

        card.appendChild(el("div", "recipe-photo", rc.emoji));

        var info = el("div", "recipe-info");
        info.appendChild(el("div", "recipe-name", rc.name));
        var meta = el("div", "recipe-meta");
        var metaText = el("div", "recipe-meta-text", describeRecipeMatch(match));
        metaText.title = describeRecipeMatch(match);
        meta.appendChild(metaText);
        meta.appendChild(createRecipeStatusPill(match));
        info.appendChild(meta);

        if (match.missing.length > 0) {
          var addBtn = el("button", "btn-primary btn-sm", "🛒 부족 재료 담기");
          addBtn.type = "button";
          addBtn.addEventListener("click", function() {
            var addedCount = 0;
            for (var a = 0; a < match.missing.length; a++) {
              if (addIngredientToBuyList(match.missing[a].name)) addedCount++;
            }
            showToast("🛒 '" + rc.name + "' 부족 재료 " + addedCount + "개가 쇼핑 리스트에 추가되었습니다!");
            state.subMode = "buy";
            renderAll();
          });
          info.appendChild(addBtn);
        }
        card.appendChild(info);

        return card;
      }

      // v2 레시피 필터 (세션 변수 — localStorage 저장 안 함)
      var recipeFilterCookNow = false;
      var recipeFilterExpiring = false;
      var recipeSearchText = "";

      // "곧 떨어지는 재료 사용": 소비주기의 절반 이상 지난 재고 품목을 쓰는 요리
      function recipeUsesExpiringItem(match) {
        var ings = match.recipe.ingredients;
        for (var i = 0; i < ings.length; i++) {
          var found = findInventoryItemForIngredient(ings[i]);
          if (!found) continue;
          var ev = evaluateItem(found);
          if (ev.isShort || ev.elapsed >= Math.max(1, found.cycleDays) * 0.5) return true;
        }
        return false;
      }

      function recipeMatchesSearch(match) {
        var q = normalizeFoodName(recipeSearchText);
        if (!q) return true;
        if (normalizeFoodName(match.recipe.name).indexOf(q) !== -1) return true;
        for (var i = 0; i < match.recipe.ingredients.length; i++) {
          if (normalizeFoodName(match.recipe.ingredients[i]).indexOf(q) !== -1) return true;
        }
        return false;
      }

      function renderRecipeFilterChips() {
        var wrap = document.getElementById("recipe-filter-chips");
        if (!wrap) return;
        wrap.replaceChildren();
        var chips = [
          { label: "✅ 바로 가능", active: recipeFilterCookNow, toggle: function() { recipeFilterCookNow = !recipeFilterCookNow; } },
          { label: "⏳ 곧 떨어지는 재료 사용", active: recipeFilterExpiring, toggle: function() { recipeFilterExpiring = !recipeFilterExpiring; } }
        ];
        chips.forEach(function(chip) {
          var btn = el("button", chip.active ? "fchip active" : "fchip", chip.label);
          btn.type = "button";
          btn.setAttribute("aria-pressed", chip.active ? "true" : "false");
          btn.addEventListener("click", function() {
            chip.toggle();
            renderRecipeView();
          });
          wrap.appendChild(btn);
        });
      }

      function renderRecipeView() {
        var btnList = document.getElementById("toggle-recipe-list");
        var btnChat = document.getElementById("toggle-chat-recipe");
        var subList = document.getElementById("subview-recipe-list");
        var subChat = document.getElementById("subview-chat-recipe");
        if (btnList && btnChat && subList && subChat) {
          if (state.recipeMode !== "chat") state.recipeMode = "list";
          btnList.className = state.recipeMode === "list" ? "seg-btn active" : "seg-btn";
          btnChat.className = state.recipeMode === "chat" ? "seg-btn active" : "seg-btn";
          subList.classList.toggle("hidden", state.recipeMode !== "list");
          subChat.classList.toggle("hidden", state.recipeMode !== "chat");
        }

        var wrap = document.getElementById("recipe-list");
        if (!wrap) return;
        wrap.replaceChildren();

        if (state.items.length === 0) {
          var rcpEmpty = el(
            "div",
            "sub",
            "인벤토리가 비어 있어 요리를 추천할 수 없어요. 🥬 '인벤토리' 탭에서 영수증을 등록하거나 품목을 추가하면, 지금 재료로 만들 수 있는 요리를 보여드립니다 🙂"
          );
          rcpEmpty.style.padding = "20px";
          rcpEmpty.style.textAlign = "center";
          wrap.appendChild(rcpEmpty);
          return;
        }

        renderRecipeFilterChips();

        var matches = getRecipeMatches().filter(function(m) {
          if (recipeFilterCookNow && m.missing.length > 0) return false;
          if (recipeFilterExpiring && !recipeUsesExpiringItem(m)) return false;
          return recipeMatchesSearch(m);
        });
        var makeable = [];
        var nearMiss = [];
        for (var i = 0; i < matches.length; i++) {
          if (matches[i].missing.length === 0) makeable.push(matches[i]);
          else nearMiss.push(matches[i]);
        }
        nearMiss.sort(function(a, b) { return a.missing.length - b.missing.length; });

        if (matches.length === 0) {
          var noMatch = el("div", "sub preview-empty", "조건에 맞는 요리가 없어요. 검색어나 필터를 바꿔보세요 🙂");
          wrap.appendChild(noMatch);
          return;
        }

        if (makeable.length > 0) {
          wrap.appendChild(el("div", "section-label recipe-section-label", "✅ 지금 만들 수 있는 요리 (" + makeable.length + "개)"));
          var gridOk = el("div", "recipe-grid");
          for (var m = 0; m < makeable.length; m++) {
            gridOk.appendChild(createRecipeCard(makeable[m]));
          }
          wrap.appendChild(gridOk);
        } else if (!recipeFilterCookNow) {
          wrap.appendChild(el("div", "sub recipe-section-label", "아직 재료가 모두 갖춰진 요리는 없어요. 아래에서 골라보세요 🙂"));
        }

        if (nearMiss.length > 0) {
          wrap.appendChild(el("div", "section-label recipe-section-label", "🛒 재료가 조금 부족한 요리 (부족 재료를 쇼핑 리스트에 담을 수 있어요)"));
          var gridMiss = el("div", "recipe-grid");
          for (var t = 0; t < nearMiss.length; t++) {
            gridMiss.appendChild(createRecipeCard(nearMiss[t]));
          }
          wrap.appendChild(gridMiss);
        }
      }

      function executeOrderNow() {
        var orderedCount = 0;
        var totalPaid = 0.0;
        for (var i = 0; i < state.items.length; i++) {
          var it = state.items[i];
          var ev = evaluateItem(it);
          if (ev.isShort && it.checkedForOrder !== false) {
            it.boughtDay = state.dayOffset;
            it.manualNeedToBuy = false;
            it.isManuallyAdded = false;
            orderedCount++;
            totalPaid += it.price;
          }
        }
        if (orderedCount === 0) {
          showToast("주문할 품목이 없습니다.");
          return;
        }
        state.activeTab = "inventory";
        state.subMode = "inventory";
        showToast("🎉 주문 완료! " + orderedCount + "개 품목($" + totalPaid.toFixed(2) + ")이 '오늘 구매'로 채워졌습니다.");
        renderAll();
      }

      function renderMainView() {
        var invContainer = document.getElementById("subview-inventory");
        var buyList = document.getElementById("buy-list");
        invContainer.replaceChildren();
        buyList.replaceChildren();

        var shortCount = 0;
        var skipCount = 0;
        var savedMoney = 0.0;
        var buyEntries = [];

        if (state.items.length === 0) {
          var invEmpty = el(
            "div",
            "sub",
            "아직 인벤토리가 비어 있어요. 📸 '영수증' 탭에서 영수증 사진을 올리거나, 🛒 '쇼핑' 탭에서 품목을 직접 추가해 주세요. 등록된 품목은 소진 예측으로 알아서 관리해 드립니다 🙂"
          );
          invEmpty.style.padding = "20px";
          invEmpty.style.textAlign = "center";
          invContainer.appendChild(invEmpty);
        }

        for (var i = 0; i < state.items.length; i++) {
          var item = state.items[i];
          var ev = evaluateItem(item);

          if (ev.isShort) {
            shortCount++;
            buyEntries.push({ item: item, ev: ev });
          } else {
            skipCount++;
            savedMoney += item.price;
          }

          // v2 필터 칩 (전체 / ⚠️ 부족 / ✅ 충분) — 표시만 거르고 집계는 전체 기준
          if (inventoryFilter === "short" && !ev.isShort) continue;
          if (inventoryFilter === "ok" && ev.isShort) continue;
          invContainer.appendChild(createInventoryItemCard(item, ev));
        }

        var btnInv = document.getElementById("toggle-inventory");
        var btnBuy = document.getElementById("toggle-buy");
        var btnRcpt = document.getElementById("toggle-receipt");
        var btnChatInv = document.getElementById("toggle-chat-inv");
        btnInv.textContent = "🥬 인벤토리 (" + state.items.length + ")";
        btnBuy.textContent = "🛒 쇼핑 (" + shortCount + ")";
        btnInv.className = state.subMode === "inventory" ? "seg-btn active" : "seg-btn";
        btnBuy.className = state.subMode === "buy" ? "seg-btn active" : "seg-btn";
        btnRcpt.className = state.subMode === "receipt" ? "seg-btn active" : "seg-btn";
        btnChatInv.className = state.subMode === "chat" ? "seg-btn active" : "seg-btn";

        document.getElementById("subview-inventory").classList.toggle("hidden", state.subMode !== "inventory");
        document.getElementById("subview-buy").classList.toggle("hidden", state.subMode !== "buy");
        document.getElementById("subview-receipt").classList.toggle("hidden", state.subMode !== "receipt");
        document.getElementById("subview-chat-inv").classList.toggle("hidden", state.subMode !== "chat");

        var badge = document.getElementById("mode-summary-badge");
        // 3종 배지 외 배지 금지 규칙: 요약 정보는 배지(pill)가 아닌 일반 안내 텍스트(sub)로 표시
        badge.className = "sub";
        badge.style.fontWeight = "700";
        if (state.subMode === "inventory") {
          badge.textContent = "⚠️ 부족 " + shortCount + "개 · ✅ 충분 " + skipCount + "개";
        } else if (state.subMode === "buy") {
          badge.textContent = "✅ 안 사도 되는 " + skipCount + "개로 $" + savedMoney.toFixed(2) + " 절약";
        } else if (state.subMode === "receipt") {
          badge.textContent = "📄 영수증 " + (Array.isArray(state.receipts) ? state.receipts.length : 0) + "건";
        } else {
          badge.textContent = "💬 AI 장보기 어드바이저";
        }

        var orderTotal = 0.0;
        if (buyEntries.length === 0) {
          var empty = el(
            "div",
            "sub",
            state.items.length === 0
              ? "쇼핑 리스트가 비어 있어요. 먼저 🥬 인벤토리에 품목을 추가하면 소진 예측으로 사야 할 것을 자동으로 담아드립니다."
              : "지금은 사야 할 품목이 없어요! 재료가 모두 충분합니다 🎉 상단 [+7일]·[+14일] 버튼으로 미래 시점의 소진 예측을 미리 확인해 보세요."
          );
          empty.style.padding = "20px";
          empty.style.textAlign = "center";
          buyList.appendChild(empty);
        } else {
          for (var b = 0; b < buyEntries.length; b++) {
            (function(entry) {
              var row = el("label", "item-card");
              row.style.cursor = "pointer";
              var left = el("div", "item-left");

              var cb = document.createElement("input");
              cb.type = "checkbox";
              cb.checked = entry.item.checkedForOrder !== false;
              cb.addEventListener("change", function() {
                entry.item.checkedForOrder = cb.checked;
                renderMainView();
              });
              left.appendChild(cb);
              left.appendChild(createThumbImg(entry.item));

              var info = el("div", "item-info");
              info.appendChild(el("div", "item-name", entry.item.name));
              info.appendChild(el("div", "item-days", formatDaysAgo(entry.item, entry.ev.elapsed)));
              left.appendChild(info);
              row.appendChild(left);

              var right = el("div", "btn-group");
              right.appendChild(el("span", "pill pill-buy", "🛒 사야 한다"));
              right.appendChild(el("span", "item-name", "$" + entry.item.price.toFixed(2)));
              row.appendChild(right);

              buyList.appendChild(row);

              if (entry.item.checkedForOrder !== false) {
                orderTotal += entry.item.price;
              }
            })(buyEntries[b]);
          }
        }

        document.getElementById("checkout-total").textContent = "$" + orderTotal.toFixed(2);
        renderInventoryExtras();
        saveState();
      }

      // ====================================================================
      // v2 인벤토리 부가 영역: 페이지 헤더 · 절약 밴드 · 필터 칩 · 📈 소비 패턴 · 사이드 패널
      // ====================================================================
      var inventoryFilter = "all"; // 세션 변수 (localStorage 저장 안 함): "all" | "short" | "ok"

      function renderInventoryExtras() {
        var summary = computeInventorySummary();
        var receiptCount = Array.isArray(state.receipts) ? state.receipts.length : 0;

        document.getElementById("inv-page-sub").textContent =
          "품목 " + state.items.length + "개 · 영수증 " + receiptCount + "건과 소진 예측 기준";

        // 절약 밴드
        document.getElementById("inv-saved-amount").textContent = "$" + summary.savedMoney.toFixed(2) + " 절약";
        document.getElementById("inv-saved-meta").textContent =
          "✅ 안 사도 되는 품목 " + summary.okEntries.length + "개";
        document.getElementById("inv-saved-dup").textContent = "$" + summary.savedMoney.toFixed(2);
        var okNames = summary.okEntries.slice(0, 3).map(function(e) { return e.item.name; });
        document.getElementById("inv-saved-dup-items").textContent =
          okNames.length ? okNames.join(", ") + (summary.okEntries.length > 3 ? " 외" : "") : "아직 없음";

        // 필터 칩 (인벤토리 서브뷰에서만)
        var chipsWrap = document.getElementById("inv-filter-chips");
        chipsWrap.replaceChildren();
        chipsWrap.classList.toggle("hidden", state.subMode !== "inventory");
        var chips = [
          { key: "all", label: "전체 " + state.items.length },
          { key: "short", label: "⚠️ 부족 " + summary.shortEntries.length },
          { key: "ok", label: "✅ 충분 " + summary.okEntries.length }
        ];
        for (var c = 0; c < chips.length; c++) {
          (function(chip) {
            var btn = el("button", inventoryFilter === chip.key ? "fchip active" : "fchip", chip.label);
            btn.type = "button";
            btn.addEventListener("click", function() {
              inventoryFilter = chip.key;
              renderMainView();
            });
            chipsWrap.appendChild(btn);
          })(chips[c]);
        }

        renderConsumptionSection(summary);
        renderInventorySidePanel(summary);
      }

      // 📈 소비 패턴 (web/CLAUDE.md §1.1 예외 섹션): 구매 주기·소진 예상일·HSMM 3단계·근거 영수증 수
      function renderConsumptionSection(summary) {
        var wrap = document.getElementById("inv-consumption");
        wrap.replaceChildren();
        var visible = state.subMode === "inventory" && summary.entries.length > 0;
        wrap.classList.toggle("hidden", !visible);
        if (!visible) return;

        var rows = summary.entries.filter(function(e) {
          if (inventoryFilter === "short") return e.ev.isShort;
          if (inventoryFilter === "ok") return !e.ev.isShort;
          return true;
        });
        rows.sort(function(a, b) {
          return (a.item.cycleDays - a.ev.elapsed) - (b.item.cycleDays - b.ev.elapsed);
        });

        wrap.appendChild(el("div", "section-label", "📈 소비 패턴 · 영수증으로 추정"));
        if (rows.length === 0) {
          wrap.appendChild(el("div", "sub preview-empty", "이 조건에 맞는 품목이 없어요."));
          return;
        }

        var table = el("div", "cons-table");
        var head = el("div", "cons-row cons-th");
        ["품목", "남은 양 (추정)", "소비 속도", "소진 예상", "근거"].forEach(function(h) {
          head.appendChild(el("div", "", h));
        });
        table.appendChild(head);

        for (var i = 0; i < rows.length; i++) {
          var item = rows[i].item;
          var ev = rows[i].ev;
          var cycle = Math.max(1, Math.round(Number(item.cycleDays) || 1));
          var speedText = "약 " + cycle + "일마다";
          var remain = Math.max(0, Math.round(cycle - ev.elapsed));
          var stage = getHsmmStage(ev.belief);

          var row = el("div", "cons-row");

          var nameCell = el("div", "cons-cell-name");
          nameCell.appendChild(el("div", "cons-name", item.name));
          nameCell.appendChild(el("div", "cons-sub cons-sub-web", formatDaysAgo(item, ev.elapsed)));
          nameCell.appendChild(el("div", "cons-sub cons-sub-mobile", speedText));
          row.appendChild(nameCell);

          var handCell = el("div", "cons-cell-hand");
          var bar = el("div", ev.isShort ? "stage-bar low" : "stage-bar");
          bar.setAttribute("role", "img");
          bar.setAttribute("aria-label", "남은 양 " + stage.label);
          for (var sgi = 1; sgi <= 3; sgi++) {
            bar.appendChild(el("span", sgi <= stage.level ? "stage-seg on" : "stage-seg"));
          }
          handCell.appendChild(bar);
          handCell.appendChild(el("div", "stage-label", stage.label));
          row.appendChild(handCell);

          row.appendChild(el("div", "cons-cell-speed cons-speed", speedText));

          var outCell = el("div", "cons-cell-out");
          outCell.appendChild(el(
            "span",
            ev.isShort ? "rpill rpill-warn" : "rpill",
            remain === 0 ? "지금 소진" : "약 " + remain + "일 후"
          ));
          row.appendChild(outCell);

          var rc = countReceiptsForItem(item);
          row.appendChild(el(
            "div",
            "cons-cell-basis cons-basis",
            rc > 0 ? "영수증 " + rc + "건" : (item.isManuallyAdded ? "직접 추가" : "기본 추정")
          ));

          table.appendChild(row);
        }
        wrap.appendChild(table);
        wrap.appendChild(el("div", "section-label", "전체 품목"));
      }

      function renderInventorySidePanel(summary) {
        var list = document.getElementById("inv-side-short");
        list.replaceChildren();
        if (summary.shortEntries.length === 0) {
          list.appendChild(el("div", "sub preview-empty", "지금은 부족한 재료가 없어요 🎉"));
        } else {
          for (var i = 0; i < Math.min(3, summary.shortEntries.length); i++) {
            list.appendChild(createInventoryItemCard(summary.shortEntries[i].item, summary.shortEntries[i].ev));
          }
        }
        document.getElementById("inv-side-buy-btn").textContent =
          "🛒 쇼핑 리스트 보기 (" + summary.shortEntries.length + ")";
      }

      // ====================================================================
      // 🏠 메인 화면 (Figma "Nuvori — Home JL Edit" · web/CLAUDE.md §1 화면 1)
      // ====================================================================
      // 통화: 현재 데이터(영수증·기본 품목)가 달러 기준이라 표시도 달러로 한다.
      // 원화 전환은 데이터 계약(inventory-state)과 함께 바꿔야 하므로 이 상수 하나로 모아 둔다.
      var CURRENCY_SYMBOL = "$";
      function formatMoney(amount) {
        return CURRENCY_SYMBOL + (Number(amount) || 0).toFixed(2);
      }

      // "유기농 계란 (12구)" → "유기농 계란"
      function shortItemName(name) {
        return String(name || "").replace(/\s*\([^)]*\)\s*/g, " ").trim();
      }

      function getSortedRecipeMatches() {
        var matches = getRecipeMatches();
        matches.sort(function(a, b) { return a.missing.length - b.missing.length; });
        return matches;
      }

      function getTonightPick() {
        var matches = getSortedRecipeMatches();
        return matches.length > 0 ? matches[0] : null;
      }

      // 빨리 써야 하는 품목: 아직 부족하지 않은 신선 식품(주기 14일 이하) 중 남은 날이 적은 순
      function getUseSoonEntries(summary) {
        return summary.okEntries
          .filter(function(e) { return (Number(e.item.cycleDays) || 0) <= 14; })
          .map(function(e) {
            return { item: e.item, daysLeft: Math.max(0, Math.round(e.item.cycleDays * 0.75) - e.ev.elapsed) };
          })
          .sort(function(a, b) { return a.daysLeft - b.daysLeft; });
      }

      function mostCommonStore(entries) {
        var counts = {};
        var best = "";
        entries.forEach(function(e) {
          var store = e.item.lastStore;
          if (!store) return;
          counts[store] = (counts[store] || 0) + 1;
          if (!best || counts[store] > counts[best]) best = store;
        });
        return best;
      }

      function renderHomeView() {
        var summary = computeInventorySummary();
        var hasItems = state.items.length > 0;

        // 절약액 알약 — 로그인한 사용자에게만 보여준다 (로그아웃 상태에선 누구의 절약인지 알 수 없음)
        var session = window.NuvoriAuth && window.NuvoriAuth.getSession();
        document.getElementById("nv-savings").hidden = !(session && session.user);
        document.getElementById("nv-savings-amount").textContent = (Number(summary.savedMoney) || 0).toFixed(2);
        document.querySelector("#nv-savings .nv-coin").textContent = CURRENCY_SYMBOL;
        document.getElementById("nv-savings").setAttribute("aria-label", "이번 주 절약액 " + formatMoney(summary.savedMoney));

        // 오늘 저녁
        var pick = hasItems ? getTonightPick() : null;
        var sub = document.getElementById("nv-home-sub");
        var tonightTitle = document.getElementById("nv-tonight-title");
        var tonightSub = document.getElementById("nv-tonight-sub");
        if (!pick) {
          sub.textContent = "영수증을 올려 주면 오늘 저녁을 골라 드릴게요.";
          tonightTitle.textContent = "아직 고를 재료가 없어요";
          tonightSub.textContent = "영수증을 추가해 주세요";
        } else if (pick.missing.length === 0) {
          sub.textContent = "오늘 저녁은 " + pick.recipe.name + " 어때요? 재료가 다 있어요.";
          tonightTitle.textContent = pick.recipe.name;
          tonightSub.textContent = "재료가 다 있어요";
        } else {
          var missingNames = pick.missing.map(function(m) { return m.name; });
          sub.textContent = "오늘 저녁은 " + pick.recipe.name + " 어때요? " + missingNames.join(", ") + "만 있으면 돼요.";
          tonightTitle.textContent = pick.recipe.name;
          tonightSub.textContent = missingNames.join(", ") + " 필요해요";
        }

        // 빨리 써야 해요
        var useSoon = getUseSoonEntries(summary);
        var useSoonTitle = document.getElementById("nv-usesoon-title");
        var useSoonSub = document.getElementById("nv-usesoon-sub");
        if (useSoon.length === 0) {
          useSoonTitle.textContent = hasItems ? "급한 재료가 없어요" : "재료를 기다리고 있어요";
          useSoonSub.textContent = hasItems ? "여유 있게 드셔도 돼요" : "영수증을 올리면 알려 드릴게요";
        } else {
          useSoonTitle.textContent = useSoon.slice(0, 3).map(function(e) { return shortItemName(e.item.name); }).join(", ");
          var first = useSoon[0];
          useSoonSub.textContent = first.daysLeft === 0 ? "오늘 안에 써 주세요" : "가장 급한 건 " + first.daysLeft + "일 남았어요";
        }

        // 장보기
        var groceryTitle = document.getElementById("nv-grocery-title");
        var grocerySub = document.getElementById("nv-grocery-sub");
        var toBuy = summary.shortEntries;
        if (toBuy.length === 0) {
          groceryTitle.textContent = "지금은 살 게 없어요";
          grocerySub.textContent = "필요해지면 목록에 넣어 둘게요";
        } else {
          var est = toBuy.reduce(function(sum, e) { return sum + (Number(e.item.price) || 0); }, 0);
          var store = mostCommonStore(toBuy);
          groceryTitle.textContent = toBuy.length + "개 사야 해요";
          grocerySub.textContent = "예상 " + formatMoney(est) + (store ? " · " + store : "");
        }

        renderHomeSuggestions(summary);
      }

      // 빠른 칩 (Figma: Suggestions — 요리 시작 / 외식 / 재료 소진 / 장보기 주문)
      function renderHomeSuggestions(summary) {
        var wrap = document.getElementById("nv-suggestions");
        var outItem = summary.shortEntries.length > 0 ? shortItemName(summary.shortEntries[0].item.name) : "계란";
        var chips = [
          { label: "요리 시작", run: function() { goToTab("recipe"); } },
          { label: "오늘 외식해", run: function() { openHomeChat("오늘 저녁은 외식해"); } },
          { label: outItem + " 다 떨어졌어", run: function() { openHomeChat(outItem + " 다 떨어졌어"); } },
          { label: "장보기 주문", run: function() { openShoppingList(); showToast("자동 주문은 준비 중이에요. 우선 장보기 목록을 보여 드릴게요."); } }
        ];
        wrap.replaceChildren();
        chips.forEach(function(chip) {
          var btn = el("button", "nv-pill", chip.label);
          btn.type = "button";
          btn.addEventListener("click", chip.run);
          wrap.appendChild(btn);
        });
      }

      // 대화(Talk) 시트가 생기기 전까지는 기존 인벤토리 챗으로 보낸다
      function openHomeChat(text) {
        state.activeTab = "inventory";
        state.subMode = "chat";
        renderAll();
        window.scrollTo(0, 0);
        if (text) handleChatSubmit(text);
      }

      function openShoppingList() {
        state.activeTab = "inventory";
        state.subMode = "buy";
        renderAll();
        window.scrollTo(0, 0);
      }

      // 🎤 음성 입력 — 마이크를 누를 때만 듣는다 (상시 호출어 감지 없음, web/CLAUDE.md §1)
      var homeRecognition = null;
      function startHomeVoice() {
        var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        var input = document.getElementById("nv-composer-input");
        var mic = document.getElementById("nv-mic");
        if (!Recognition) {
          showToast("이 브라우저는 음성 입력을 지원하지 않아요. 글로 입력해 주세요.");
          input.focus();
          return;
        }
        if (homeRecognition) {
          homeRecognition.stop();
          return;
        }
        homeRecognition = new Recognition();
        homeRecognition.lang = "ko-KR";
        homeRecognition.interimResults = true;
        homeRecognition.maxAlternatives = 1;
        mic.classList.add("is-listening");
        mic.setAttribute("aria-label", "듣는 중 — 누르면 멈춰요");
        var finalText = "";
        homeRecognition.onresult = function(ev) {
          var text = "";
          for (var i = 0; i < ev.results.length; i++) {
            text += ev.results[i][0].transcript;
            if (ev.results[i].isFinal) finalText = text;
          }
          input.value = text;
        };
        homeRecognition.onerror = function(ev) {
          if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
            showToast("마이크 권한이 필요해요. 설정에서 허용해 주세요.");
          }
        };
        homeRecognition.onend = function() {
          homeRecognition = null;
          mic.classList.remove("is-listening");
          mic.setAttribute("aria-label", "말로 하기");
          var text = (finalText || input.value).trim();
          if (text) {
            input.value = "";
            openHomeChat(text);
          }
        };
        homeRecognition.start();
      }

      // ====================================================================
      // 💬 장보기 챗 (Natural-Language Query -> HSMM Time Shift + Shopping List Card)
      // ====================================================================
      function extractChatIntent(rawText) {
        var text = String(rawText || "").trim();
        var detectedDays = null;

        var dayMatch = text.match(/(\d+)\s*일\s*(됐|되|지났|경과|뒤|후|차|째)?/);
        var weekMatch = text.match(/(\d+)\s*주\s*(됐|되|지났|경과|뒤|후|차|째)?/);
        if (dayMatch) {
          detectedDays = Math.min(60, Math.max(0, parseInt(dayMatch[1], 10)));
        } else if (weekMatch) {
          detectedDays = Math.min(60, Math.max(0, parseInt(weekMatch[1], 10) * 7));
        } else if (text.indexOf("일주일") !== -1) {
          detectedDays = 7;
        } else if (text.indexOf("보름") !== -1 || text.indexOf("2주") !== -1) {
          detectedDays = 14;
        } else if (text.indexOf("사흘") !== -1) {
          detectedDays = 3;
        } else if (text.indexOf("이틀") !== -1) {
          detectedDays = 2;
        } else if (text.indexOf("나흘") !== -1) {
          detectedDays = 4;
        } else if (text.indexOf("닷새") !== -1) {
          detectedDays = 5;
        } else if (text.indexOf("열흘") !== -1) {
          detectedDays = 10;
        } else if (text.indexOf("오늘 기준") !== -1 || text.indexOf("당장") !== -1) {
          detectedDays = 0;
        }

        var depletedItemName = null;
        var asksDepleted = (
          text.indexOf("다 먹") !== -1 ||
          text.indexOf("떨어졌") !== -1 ||
          text.indexOf("없어") !== -1 ||
          text.indexOf("추가") !== -1 ||
          (text.indexOf("사야") !== -1 && text.indexOf("뭐") === -1 && text.indexOf("무엇") === -1)
        );
        if (asksDepleted) {
          for (var i = 0; i < state.items.length; i++) {
            var shortNoun = state.items[i].name.split(" ")[0];
            if (text.indexOf(state.items[i].name) !== -1 || (shortNoun.length >= 2 && text.indexOf(shortNoun) !== -1)) {
              state.items[i].manualNeedToBuy = true;
              state.items[i].isManuallyAdded = true;
              state.items[i].checkedForOrder = true;
              depletedItemName = state.items[i].name;
              break;
            }
          }
        }

        var lowConsumptionWeek = (
          text.indexOf("외식") !== -1 ||
          text.indexOf("배달") !== -1 ||
          text.indexOf("집밥 1") !== -1 ||
          text.indexOf("집밥 2") !== -1 ||
          text.indexOf("조금만") !== -1 ||
          text.indexOf("바빠") !== -1
        );

        return {
          detectedDays: detectedDays,
          depletedItemName: depletedItemName,
          lowConsumptionWeek: lowConsumptionWeek
        };
      }

      function buildShoppingListBubble(userQuery, intentResult) {
        var botBubble = el("div", "chat-bubble-bot");

        var dayLabel = state.dayOffset === 0 ? "오늘(기준일)" : ("장본 지 +" + state.dayOffset + "일 경과");
        var buyEntries = [];
        var skipEntries = [];
        var holdPerishables = [];
        var totalCost = 0.0;
        var savedCost = 0.0;

        for (var i = 0; i < state.items.length; i++) {
          var item = state.items[i];
          var ev = evaluateItem(item);
          if (ev.isShort) {
            if (intentResult.lowConsumptionWeek && item.cycleDays <= 6 && !item.manualNeedToBuy) {
              holdPerishables.push(item);
              skipEntries.push({ item: item, ev: ev });
              savedCost += item.price;
            } else {
              buyEntries.push({ item: item, ev: ev });
              totalCost += item.price;
            }
          } else {
            skipEntries.push({ item: item, ev: ev });
            savedCost += item.price;
          }
        }

        var headerMsg = "";
        if (intentResult.depletedItemName) {
          headerMsg = "✅ '" + intentResult.depletedItemName + "' 품목을 쇼핑 리스트에 반영했습니다! ";
        }
        if (intentResult.lowConsumptionWeek) {
          headerMsg += "🍽️ [외식 다수 · 저소비 주간 모드] 이번 주 예상 소비량이 적으므로 단기 부패 신선식품(" +
            (holdPerishables.map(function(p) { return p.name; }).join(", ") || "잎채소류") +
            ")은 폐기 방지를 위해 제외하고 꼭 필요한 " + buyEntries.length + "개($" + totalCost.toFixed(2) + ")만 추렸습니다:";
        } else if (intentResult.detectedDays !== null) {
          headerMsg += "⏱️ 시점을 [" + dayLabel + "]로 이동해 소진 예측(HSMM)을 계산한 결과, 사야 할 품목은 " + buyEntries.length + "개($" + totalCost.toFixed(2) + ")입니다:";
        } else {
          headerMsg += "📊 현재 [" + dayLabel + "] 기준 사야 할 쇼핑 리스트는 " + buyEntries.length + "개($" + totalCost.toFixed(2) + ")입니다:";
        }
        botBubble.appendChild(el("div", "chat-bot-text", headerMsg));

        var shopBox = el("div", "chat-shop-box");
        if (buyEntries.length === 0) {
          shopBox.appendChild(el("div", "sub", "현재 사야 할 부족 품목이 없습니다! 모든 식재료가 집에 충분합니다."));
        } else {
          for (var b = 0; b < buyEntries.length; b++) {
            var entry = buyEntries[b];
            var row = el("div", "item-card");
            row.style.padding = "9px 12px";

            var left = el("div", "item-left");
            left.appendChild(createThumbImg(entry.item));
            var info = el("div", "item-info");
            info.appendChild(el("div", "item-name", entry.item.name));
            var depPct = Math.round(entry.ev.belief.pDepleted * 100);
            var subDesc = formatDaysAgo(entry.item, entry.ev.elapsed) + " · 고갈확률 " + depPct + "% (주기 " + entry.item.cycleDays + "일)";
            info.appendChild(el("div", "item-days", subDesc));
            left.appendChild(info);
            row.appendChild(left);

            var right = el("div", "btn-group");
            right.appendChild(el("span", "pill pill-buy", "🛒 사야 한다"));
            right.appendChild(el("span", "item-name", "$" + entry.item.price.toFixed(2)));
            row.appendChild(right);

            shopBox.appendChild(row);
          }
        }

        if (skipEntries.length > 0) {
          var skipNames = skipEntries.map(function(s) { return s.item.name; }).join(", ");
          shopBox.appendChild(
            el(
              "div",
              "chat-skip-note",
              "✅ 집에 아직 충분하거나 구매 보류로 아낀 품목 (" + skipEntries.length + "개 · $" + savedCost.toFixed(2) + " 절약): " + skipNames
            )
          );
        }

        var footerRow = el("div", "header-row");
        footerRow.style.marginTop = "4px";
        footerRow.appendChild(el("div", "item-name", "🛒 쇼핑 리스트 합계: $" + totalCost.toFixed(2)));

        var actionGroup = el("div", "btn-group");
        var btnGoBuyTab = el("button", "btn-sm", "🛒 쇼핑 리스트 탭 열기");
        btnGoBuyTab.type = "button";
        btnGoBuyTab.addEventListener("click", function() {
          state.activeTab = "inventory";
          state.subMode = "buy";
          renderAll();
        });
        actionGroup.appendChild(btnGoBuyTab);

        if (buyEntries.length > 0) {
          var btnQuickOrder = el("button", "btn-primary btn-sm", "🚀 바로 주문 완료");
          btnQuickOrder.type = "button";
          btnQuickOrder.addEventListener("click", function() {
            executeOrderNow();
          });
          actionGroup.appendChild(btnQuickOrder);
        }
        footerRow.appendChild(actionGroup);
        shopBox.appendChild(footerRow);

        botBubble.appendChild(shopBox);

        var fastSpoilInBuy = buyEntries.filter(function(e) { return e.item.cycleDays <= 6; }).map(function(e) { return e.item.name; });
        var inStockFresh = skipEntries.filter(function(e) { return e.item.cycleDays <= 10; }).map(function(e) { return e.item.name; });
        var dynamicTip = "💡 소비 기반 장보기 팁: ";
        if (fastSpoilInBuy.length > 0) {
          dynamicTip += "구매 리스트의 [" + fastSpoilInBuy.join(", ") + "]은(는) 4~5일 내 부패 위험이 높으니 이번 주 최소 2끼 이상 소비할 계획일 때만 담으세요.";
        } else {
          dynamicTip += "이번 리스트는 보관 주기가 비교적 긴 필수 스테이플 위주여서 부패로 버릴 위험이 낮습니다.";
        }
        if (inStockFresh.length > 0) {
          dynamicTip += " 집에 남아 있는 [" + inStockFresh.join(", ") + "]을(를) 오늘·내일 저녁에 먼저 소진하는 것을 추천합니다.";
        }

        var aiNote = el("div", "chat-ai-note", dynamicTip);
        botBubble.appendChild(aiNote);

        if (userQuery) {
          var invSummary = state.items.map(function(it) {
            var ev = evaluateItem(it);
            return {
              name: it.name,
              elapsed: ev.elapsed,
              cycleDays: it.cycleDays,
              pDepleted: Math.round(ev.belief.pDepleted * 100),
              isShort: ev.isShort
            };
          });
          var rcptHistory = (Array.isArray(state.receipts) ? state.receipts : [])
            .slice(0, 5)
            .map(function(r) {
              return {
                storeName: r.storeName,
                purchaseDate: r.purchaseDate,
                items: (r.items || []).slice(0, 15).map(function(it) {
                  return { name: it.name, price: Number(it.price || 0) };
                })
              };
            });
          var recipeMatches = getRecipeMatches();
          var makeableRecipes = [];
          var nearMissRecipes = [];
          for (var rm = 0; rm < recipeMatches.length; rm++) {
            if (recipeMatches[rm].missing.length === 0) {
              makeableRecipes.push(recipeMatches[rm].recipe.name);
            } else if (recipeMatches[rm].missing.length <= 2) {
              nearMissRecipes.push(
                recipeMatches[rm].recipe.name +
                " (부족: " +
                recipeMatches[rm].missing.map(function(x) { return x.name; }).join(", ") +
                ")"
              );
            }
          }
          NuvoriAPI.chatAdvisor({
            message: userQuery,
            dayOffset: state.dayOffset,
            inventorySummary: invSummary,
            receiptHistory: rcptHistory,
            makeableRecipes: makeableRecipes.slice(0, 8),
            nearMissRecipes: nearMissRecipes.slice(0, 5)
          })
          .then(function(data) {
            if (data && data.reply) {
              aiNote.textContent = "🤖 AI 코치: " + data.reply;
            }
          })
          .catch(function() {});
        }

        return botBubble;
      }

      function handleChatSubmit(customText) {
        var input = document.getElementById("input-chat-query");
        var text = typeof customText === "string" ? customText : input.value.trim();
        if (!text) return;
        if (typeof customText !== "string") {
          input.value = "";
        }

        var msgContainer = document.getElementById("chat-messages");
        msgContainer.appendChild(el("div", "chat-bubble-user", text));

        var intent = extractChatIntent(text);
        if (intent.detectedDays !== null) {
          state.dayOffset = intent.detectedDays;
        }

        renderDayButtons();
        renderMainView();

        var botReplyBubble = buildShoppingListBubble(text, intent);
        msgContainer.appendChild(botReplyBubble);
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }

      function initChatView() {
        var chipsWrap = document.getElementById("chat-quick-chips");
        chipsWrap.replaceChildren();
        for (var i = 0; i < CHAT_QUICK_PROMPTS.length; i++) {
          (function(promptText) {
            var chip = el("button", "chip-btn", "💬 " + promptText);
            chip.type = "button";
            chip.addEventListener("click", function() {
              handleChatSubmit(promptText);
            });
            chipsWrap.appendChild(chip);
          })(CHAT_QUICK_PROMPTS[i]);
        }

        var msgContainer = document.getElementById("chat-messages");
        if (msgContainer.childNodes.length === 0) {
          var welcome = el("div", "chat-bubble-bot");
          welcome.appendChild(
            el(
              "div",
              "chat-bot-text",
              "안녕하세요! 장본 지 며칠 지났는지 말씀하시거나 \"오늘 장본지 3일 됐는데, 뭐 사야돼?\"처럼 물어보시면 3-State HSMM 소진 예측을 돌려 사야 할 쇼핑 리스트를 바로 보여드립니다."
            )
          );
          msgContainer.appendChild(welcome);
        }
      }

      function renderAll() {
        if (state.activeTab !== "recipe" && state.activeTab !== "home") state.activeTab = "inventory";

        var tabInvBtn = document.getElementById("tab-inventory-btn");
        var tabRcpBtn = document.getElementById("tab-recipe-btn");
        var viewHome = document.getElementById("view-home");
        var viewInventory = document.getElementById("view-inventory");
        var viewRecipe = document.getElementById("view-recipe");

        document.body.setAttribute("data-view", state.activeTab);
        tabInvBtn.className = state.activeTab === "inventory" ? "tab-btn active" : "tab-btn";
        tabRcpBtn.className = state.activeTab === "recipe" ? "tab-btn active" : "tab-btn";
        viewHome.classList.toggle("hidden", state.activeTab !== "home");
        viewInventory.classList.toggle("hidden", state.activeTab !== "inventory");
        viewRecipe.classList.toggle("hidden", state.activeTab !== "recipe");

        // Dock the shared chat panel into the active section's chat slot
        // (appendChild on a different parent moves the node — one chat, two doors)
        var chatPanel = document.getElementById("chat-panel");
        var chatSlot = state.activeTab === "recipe"
          ? document.getElementById("subview-chat-recipe")
          : document.getElementById("subview-chat-inv");
        if (chatPanel && chatSlot && chatPanel.parentNode !== chatSlot) {
          chatSlot.appendChild(chatPanel);
        }

        // 계정 칩: 홈에서는 메인 화면 상단, 다른 화면에서는 상단 내비게이션에 둔다
        var authSlot = document.getElementById("auth-slot");
        var authHome = state.activeTab === "home"
          ? document.getElementById("nv-auth-dock")
          : document.querySelector(".topnav-inner");
        if (authSlot && authHome && authSlot.parentNode !== authHome) {
          authHome.appendChild(authSlot);
        }

        renderDayButtons();
        renderReceiptReviewEditor();
        renderReceiptDbLog();
        renderMainView();
        renderRecipeView();
        renderHomeView();
      }

      // Wire Tabs & Toggles
      document.getElementById("tab-inventory-btn").addEventListener("click", function() {
        state.activeTab = "inventory";
        renderAll();
      });

      document.getElementById("tab-recipe-btn").addEventListener("click", function() {
        state.activeTab = "recipe";
        renderAll();
      });

      // v2 라우팅: 로고(← 홈) / 홈 카드
      function goToTab(tab) {
        state.activeTab = tab;
        renderAll();
        window.scrollTo(0, 0);
      }
      document.getElementById("nav-home-btn").addEventListener("click", function() { goToTab("home"); });

      // 🏠 메인 화면 이벤트
      document.getElementById("nv-composer").addEventListener("submit", function(ev) {
        ev.preventDefault();
        var input = document.getElementById("nv-composer-input");
        var text = input.value.trim();
        if (!text) return;
        input.value = "";
        input.blur();
        openHomeChat(text);
      });
      document.getElementById("nv-mic").addEventListener("click", startHomeVoice);
      document.getElementById("nv-attach").addEventListener("click", function() { openReceiptPicker(); });
      document.getElementById("nv-card-tonight").addEventListener("click", function() { goToTab("recipe"); });
      document.getElementById("nv-card-usesoon").addEventListener("click", function() {
        state.subMode = "inventory";
        goToTab("inventory");
      });

      function compressImageToBase64(file, callback) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() {
            var maxDim = 1600;
            var w = img.width;
            var h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round(h * (maxDim / w));
                w = maxDim;
              } else {
                w = Math.round(w * (maxDim / h));
                h = maxDim;
              }
            }
            var canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            var dataUrl = canvas.toDataURL("image/jpeg", 0.88);
            var base64Data = dataUrl.split(",")[1];
            callback(null, base64Data);
          };
          img.onerror = function() { callback(new Error("이미지 로드 실패")); };
          img.src = e.target.result;
        };
        reader.onerror = function() { callback(new Error("파일 읽기 실패")); };
        reader.readAsDataURL(file);
      }

      function requestReceiptOcr(base64Jpeg) {
        var statusTitle = document.getElementById("upload-status-title");
        var statusSub = document.getElementById("upload-status-sub");
        statusTitle.textContent = "⏳ 영수증 AI 분석 중...";
        statusSub.textContent = "인식 완료 후 바로 등록되지 않고 확인/수정 창이 열립니다";

        var existingNames = state.items.map(function(it) { return it.name; });
        NuvoriAPI.parseReceipt({
          imageBase64: base64Jpeg,
          mimeType: "image/jpeg",
          existingNames: existingNames,
          todayIso: getTodayIso()
        })
        .then(function(parsed) {
          statusTitle.textContent = "영수증 사진 찍기 / 파일 올리기";
          statusSub.textContent = "사진을 올리면 아래에서 품목을 확인·수정한 뒤 등록할 수 있습니다";
          if (!parsed || parsed.isValidGroceryReceipt === false || !Array.isArray(parsed.items) || parsed.items.length === 0) {
            var reasonMsg = (parsed && parsed.reason)
              ? parsed.reason
              : "식료품 영수증이 아니거나 식재료 항목을 찾을 수 없습니다.";
            showToast("⚠️ 자동 인식 제외: " + reasonMsg + " (필요 시 아래에서 직접 수정·추가 가능)");
            openReceiptReviewEditor({
              storeName: (parsed && parsed.storeName) || "마트",
              purchaseDate: (parsed && parsed.purchaseDate) || getTodayIso(),
              note: "⚠️ AI 판별 메모: " + reasonMsg + " — 직접 품목을 입력하거나 [✕ 닫기]를 눌러 취소하세요.",
              items: [{ id: "", name: "", price: 4.50, cycleDays: 7 }]
            });
            return;
          }
          showToast("🔍 영수증 " + parsed.items.length + "개 품목 인식 완료! 내용을 확인·수정한 뒤 등록을 눌러주세요.");
          openReceiptReviewEditor({
            storeName: parsed.storeName || "마트",
            purchaseDate: parsed.purchaseDate || getTodayIso(),
            items: parsed.items
          });
        })
        .catch(function(errObj) {
          statusTitle.textContent = "영수증 사진 찍기 / 파일 올리기";
          statusSub.textContent = "사진을 올리면 아래에서 품목을 확인·수정한 뒤 등록할 수 있습니다";
          var errMsg = (errObj && errObj.message) ? errObj.message : "서버 연결 실패";
          var isKeyInvalid = errMsg.indexOf("API key not valid") !== -1 || errMsg.indexOf("GEMINI_API_KEY") !== -1;
          showToast("⚠️ 영수증 자동 파싱 오류(" + errMsg + ") — 아래 확인 창에서 직접 수정하거나 다시 파싱할 수 있습니다.");
          openReceiptReviewEditor({
            storeName: "마트",
            purchaseDate: getTodayIso(),
            needsApiKeyRetry: isKeyInvalid,
            note: isKeyInvalid
              ? "⚠️ 현재 Netlify 환경변수(GEMINI_API_KEY)가 유효하지 않습니다('API key not valid'). Netlify 환경변수에 유효한 키를 설정한 뒤 [🔄 사진 다시 파싱]을 누르거나, 품목을 직접 입력해 등록하세요."
              : ("⚠️ 영수증 자동 파싱 중 오류(" + errMsg + ")가 발생했습니다. [🔄 사진 다시 파싱]을 누르거나 품목을 직접 입력해 등록하세요."),
            items: [{ id: "", name: "", price: 4.50, cycleDays: 7 }]
          });
        });
      }

      document.getElementById("file-upload").addEventListener("change", function(ev) {

      function handleReceiptFile(file) {
        var statusTitle = document.getElementById("upload-status-title");
        var statusSub = document.getElementById("upload-status-sub");
        statusTitle.textContent = "⏳ 영수증 사진 압축 중...";

            statusTitle.textContent = "영수증 사진 찍기 / 파일 올리기";

            openReceiptReviewEditor({
              storeName: "마트",
              purchaseDate: getTodayIso(),
              note: "⚠️ 이미지 읽기에 실패하여 직접 입력/수정 모드로 열렸습니다.",
              items: [{ id: "", name: "", price: 4.50, cycleDays: 7 }]
            });
            return;
          }

          lastUploadedBase64 = base64Jpeg;
          requestReceiptOcr(base64Jpeg);
        });
      }

        for (var i = 0; i < state.items.length; i++) {

        lines.push("합계: $" + total.toFixed(2));
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(lines.join("\n"));

        showToast("📋 구매 리스트가 복사되었습니다!");
